oke-width="1.5"/><text x="465.87" y="160.75" text-anchor="middle" fill="#000000" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" font-variant-numeric="tabular-nums">2032</text><text x="465.87" y="174.75" text-anchor="middle" fill="#000000" font-family="Manrope, system-ui, sans-serif" font-size="13" font-weight="600">Sunset (if any party objects)</text><text x="465.87" y="188.75" text-anchor="middle" fill="#000000" fill-opacity="0.6" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="400" font-style="italic">annual review from 2026</text><line x1="604.00" x2="604.00" y1="220.75" y2="236.75" stroke="#000000" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 2"/><circle cx="604.00" cy="214.75" r="3" fill="none" stroke="#000000" stroke-width="1.5"/><text x="604.00" y="248.75" text-anchor="middle" fill="#000000" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" font-variant-numeric="tabular-nums">2042</text><text x="604.00" y="262.75" text-anchor="middle" fill="#000000" font-family="Manrope, system-ui, sans-serif" font-size="13" font-weight="600">Term ends (if all extend)</text><text x="604.00" y="276.75" text-anchor="middle" fill="#000000" fill-opacity="0.6" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="400" font-style="italic">16-year clock</text><text x="56" y="395.00" fill="#000000" fill-opacity="0.6" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="400">Default mechanic: unanimous extension. Single-party objection triggers annual review, not immediate fracture. Source: CRS R48787, IF10997.</text></svg>