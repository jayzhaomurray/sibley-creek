<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sibley Creek · Splash hero — map iterations</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --ink: #0a0a0a;
      --ink-2: #2a2a2a;
      --grey: #6a6a6a;
      --grey-2: #a8a8a8;
      --rule: rgba(0,0,0,0.18);
      --red: #D7263D;
      --bg: #ffffff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, "Arial", sans-serif;
      font-feature-settings: "kern" 1;
      -webkit-font-smoothing: antialiased;
    }
    .page { min-height: 100vh; display: flex; flex-direction: column; }
    /* ── NAV ──────────────────────────────────────── */
    .nav { display: flex; align-items: center; padding: 26px 56px 18px;
      border-bottom: 1px solid var(--rule); gap: 32px; }
    .brand { display: flex; align-items: center; gap: 18px; flex: 0 0 auto; }
    .brand svg { display: block; width: 138px; height: 40px; }
    .brand .lockup { display: flex; flex-direction: column; line-height: 1.05; }
    .brand .name { font-weight: 700; font-size: 19px; letter-spacing: 0.08em; }
    .brand .tag  { font-weight: 500; font-size: 10px; letter-spacing: 0.18em;
      color: var(--grey); margin-top: 4px; }
    .nav-links { display: flex; align-items: center; gap: 14px;
      margin-left: auto; font-size: 13px; letter-spacing: 0.14em; font-weight: 600; }
    .nav-links a { color: var(--ink); text-decoration: none; padding: 6px 4px; }
    .nav-links .sep { color: var(--grey-2); user-select: none; }
    .subscribe { background: var(--ink); color: #fff; padding: 12px 22px;
      font-weight: 700; font-size: 13px; letter-spacing: 0.14em;
      border: 0; cursor: pointer; }

    /* ── HERO ─────────────────────────────────────── */
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) 760px;
      gap: 48px; padding: 96px 56px 80px; flex: 1; align-items: start; }
    @media (max-width: 1180px) { .hero { grid-template-columns: 1fr; } }
    h1.head { font-size: clamp(48px, 5.6vw, 88px); font-weight: 700;
      letter-spacing: -0.025em; line-height: 1.02; margin: 0 0 36px;
      text-wrap: balance; }
    .sub { font-size: 26px; font-weight: 400; letter-spacing: -0.005em;
      color: var(--ink); margin: 0 0 36px; line-height: 1.2; max-width: 620px; }
    .body { font-size: 16px; color: var(--ink-2); line-height: 1.5;
      max-width: 460px; margin: 0 0 44px; }
    .cta-row { display: flex; gap: 14px; }
    .btn { font-weight: 700; font-size: 13px; letter-spacing: 0.14em;
      padding: 16px 22px; cursor: pointer; border: 1px solid var(--ink);
      display: inline-flex; align-items: center; gap: 12px; }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-secondary { background: transparent; color: var(--ink); }

    /* ── HERO ART (animation slot) ────────────────── */
    .art { width: 720px; height: 500px; max-width: 100%;
      position: relative; align-self: center; justify-self: end; }
    .art > svg, .art > canvas { width: 100%; height: 100%; display: block; }

    /* ── DIVIDER between stacked previews ─────────── */
    .preview-rule { border: 0; border-top: 1px solid var(--rule); margin: 0; }
    .preview-label { padding: 28px 56px 0; font-size: 11px; letter-spacing: 0.22em;
      font-weight: 700; color: var(--grey); }

    /* ── FOOTER STRIP ─────────────────────────────── */
    .footstrip { background: #0a0a0a; color: #fff; padding: 36px 56px;
      font-size: 13px; letter-spacing: 0.18em; font-weight: 600; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="scenes-map.jsx"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const SCENES = [
      { id: 'A', name: 'Watershed map',        Comp: SceneMapWatershed },
      { id: 'B', name: 'Transcontinental',     Comp: SceneMapRail },
      { id: 'C', name: 'Cities to mesh',       Comp: SceneMapTriangulation },
      { id: 'D', name: 'Skeleton to flesh',    Comp: SceneMapSkeleton },
      { id: 'E', name: 'Know what to ignore',  Comp: SceneMapIgnore },
    ];

    function SibleyLogo() {
      return (
        <svg viewBox="0 0 138 40" aria-hidden="true">
          <polyline
            points="2,28 12,24 20,16 28,20 36,12 46,18 54,8 62,14 70,6 78,18 86,14 96,22 104,18 116,20"
            fill="none" stroke="#0a0a0a" strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round"/>
          <circle cx="120" cy="22" r="2.6" fill="#D7263D"/>
        </svg>
      );
    }

    function HeroPreview({ scene }) {
      const Scene = scene.Comp;
      return (
        <div className="page">
          <div className="preview-label">PREVIEW · {scene.id} · {scene.name.toUpperCase()}</div>
          <nav className="nav">
            <div className="brand">
              <SibleyLogo/>
              <div className="lockup">
                <div className="name">SIBLEY CREEK</div>
                <div className="tag">MACRO RESEARCH &amp; ADVISORY</div>
              </div>
            </div>
            <div className="nav-links">
              <a href="#">TOPICS ▾</a>
              <span className="sep">|</span>
              <a href="#">RESEARCH</a>
              <span className="sep">|</span>
              <a href="#">ADVISORY</a>
              <span className="sep">|</span>
              <a href="#">ABOUT</a>
            </div>
            <button className="subscribe">SUBSCRIBE</button>
          </nav>

          <section className="hero">
            <div>
              <h1 className="head">Canadian macro.<br/>Until it's obvious.</h1>
              <p className="sub">Seeing clearly comes from knowing what to ignore.</p>
              <p className="body">Sibley Creek is an independent macroeconomic research and advisory firm, focused on Canada.</p>
              <div className="cta-row">
                <button className="btn btn-primary">SUBSCRIBE&nbsp;→</button>
                <button className="btn btn-secondary">HIRE&nbsp;US</button>
              </div>
            </div>
            <div className="art">
              <Scene/>
            </div>
          </section>

          <div className="footstrip">HOW WE WORK</div>
        </div>
      );
    }

    function App() {
      return (
        <div>
          {SCENES.map((s, idx) => (
            <React.Fragment key={s.id}>
              <HeroPreview scene={s} />
              {idx < SCENES.length - 1 && <hr className="preview-rule" />}
            </React.Fragment>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
