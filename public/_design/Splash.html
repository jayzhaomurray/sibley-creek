<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sibley Creek · Canadian Macro</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --ink: #0a0a0a;
      --ink-2: #2a2a2a;
      --grey: #6a6a6a;
      --grey-2: #a8a8a8;
      --rule: rgba(0,0,0,0.18);
      --red: #D7263D;
      --bg: #ffffff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, "Arial", sans-serif;
      font-feature-settings: "kern" 1;
      -webkit-font-smoothing: antialiased;
    }
    .page { min-height: 100vh; display: flex; flex-direction: column; }
    /* ── NAV ──────────────────────────────────────── */
    .nav { display: flex; align-items: center; padding: 26px 56px 18px;
      border-bottom: 1px solid var(--rule); gap: 32px; }
    .brand { display: flex; align-items: center; gap: 18px; flex: 0 0 auto; }
    .brand svg { display: block; width: 138px; height: 40px; }
    .brand .lockup { display: flex; flex-direction: column; line-height: 1.05; }
    .brand .name { font-weight: 700; font-size: 19px; letter-spacing: 0.08em; }
    .brand .tag  { font-weight: 500; font-size: 10px; letter-spacing: 0.18em;
      color: var(--grey); margin-top: 4px; }
    .nav-links { display: flex; align-items: center; gap: 14px;
      margin-left: auto; font-size: 13px; letter-spacing: 0.14em; font-weight: 600; }
    .nav-links a { color: var(--ink); text-decoration: none; padding: 6px 4px; }
    .nav-links .sep { color: var(--grey-2); user-select: none; }
    .subscribe { background: var(--ink); color: #fff; padding: 12px 22px;
      font-weight: 700; font-size: 13px; letter-spacing: 0.14em;
      border: 0; cursor: pointer; }

    /* ── HERO ─────────────────────────────────────── */
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) 760px;
      gap: 48px; padding: 96px 56px 80px; flex: 1; align-items: start; }
    @media (max-width: 1180px) { .hero { grid-template-columns: 1fr; } }
    h1.head { font-size: clamp(48px, 5.6vw, 88px); font-weight: 700;
      letter-spacing: -0.025em; line-height: 1.02; margin: 0 0 36px;
      text-wrap: balance; }
    .sub { font-size: 26px; font-weight: 400; letter-spacing: -0.005em;
      color: var(--ink); margin: 0 0 36px; line-height: 1.2; max-width: 620px; }
    .body { font-size: 16px; color: var(--ink-2); line-height: 1.5;
      max-width: 460px; margin: 0 0 44px; }
    .cta-row { display: flex; gap: 14px; }
    .btn { font-weight: 700; font-size: 13px; letter-spacing: 0.14em;
      padding: 16px 22px; cursor: pointer; border: 1px solid var(--ink);
      display: inline-flex; align-items: center; gap: 12px; }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-secondary { background: transparent; color: var(--ink); }

    /* ── HERO ART (animation slot) ────────────────── */
    .art { width: 720px; height: 500px; max-width: 100%;
      position: relative; align-self: center; justify-self: end; }
    .art > svg, .art > canvas { width: 100%; height: 100%; display: block; }

    /* ── FOOTER STRIP ─────────────────────────────── */
    .footstrip { background: #0a0a0a; color: #fff; padding: 36px 56px;
      font-size: 13px; letter-spacing: 0.18em; font-weight: 600; }

    /* Tweaks panel container — provided by tweaks-panel.jsx */
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="scenes-a.jsx"></script>
  <script type="text/babel" src="scenes-b.jsx"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const SCENES = [
      { id: '01', name: 'Elevation field',  Comp: SceneElevation,  caption: 'Live · 11 isolevels' },
      { id: '02', name: 'Drainage basin',   Comp: SceneWatershed,  caption: 'Upstream trace' },
      { id: '03', name: 'Rail · Marey',     Comp: SceneMarey,      caption: 'National schedule · 24h' },
      { id: '04', name: 'Wind · interactive', Comp: SceneWind,     caption: 'Move the cursor' },
      { id: '05', name: 'Aurora · 65°N',    Comp: SceneAurora,     caption: 'Live · Kp index' },
      { id: '06', name: 'Star trails',      Comp: SceneStarTrails, caption: 'Polaris · 64°N' },
      { id: '07', name: 'Daylight · 55°N',  Comp: SceneDaylight,   caption: 'Annual loop' },
      { id: '08', name: '49th parallel',    Comp: SceneParallel,   caption: 'Population stipple' },
    ];

    function SibleyLogo() {
      // sparkline that ends in a red dot — same visual moment as our heroes
      return (
        <svg viewBox="0 0 138 40" aria-hidden="true">
          <polyline
            points="2,28 12,24 20,16 28,20 36,12 46,18 54,8 62,14 70,6 78,18 86,14 96,22 104,18 116,20"
            fill="none" stroke="#0a0a0a" strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round"/>
          <circle cx="120" cy="22" r="2.6" fill="#D7263D"/>
        </svg>
      );
    }

    function Splash() {
      const TWEAKS = /*EDITMODE-BEGIN*/{
        "sceneIndex": 6
      }/*EDITMODE-END*/;
      const [t, setTweak] = useTweaks(TWEAKS);
      const i = Math.max(0, Math.min(SCENES.length - 1, t.sceneIndex|0));
      const Scene = SCENES[i].Comp;

      return (
        <div className="page" data-screen-label="01 Splash">
          {/* NAV */}
          <nav className="nav">
            <div className="brand">
              <SibleyLogo/>
              <div className="lockup">
                <div className="name">SIBLEY CREEK</div>
                <div className="tag">MACRO RESEARCH &amp; ADVISORY</div>
              </div>
            </div>
            <div className="nav-links">
              <a href="#">TOPICS ▾</a>
              <span className="sep">|</span>
              <a href="#">RESEARCH</a>
              <span className="sep">|</span>
              <a href="#">ADVISORY</a>
              <span className="sep">|</span>
              <a href="#">ABOUT</a>
            </div>
            <button className="subscribe">SUBSCRIBE</button>
          </nav>

          {/* HERO */}
          <section className="hero">
            <div>
              <h1 className="head">Canadian macro.<br/>Until it's obvious.</h1>
              <p className="sub">Seeing clearly comes from knowing what to ignore.</p>
              <p className="body">Sibley Creek is an independent macroeconomic research and advisory firm, focused on Canada.</p>
              <div className="cta-row">
                <button className="btn btn-primary">SUBSCRIBE&nbsp;→</button>
                <button className="btn btn-secondary">HIRE&nbsp;US</button>
              </div>
            </div>
            <div className="art">
              <Scene key={SCENES[i].id} />
            </div>
          </section>

          {/* FOOT STRIP */}
          <div className="footstrip">HOW WE WORK</div>

          {/* Tweaks panel */}
          <TweaksPanel title="Hero animation">
            <TweakSection label="Study">
              <TweakSelect
                value={String(i)}
                onChange={(v) => setTweak('sceneIndex', parseInt(v, 10))}
                options={SCENES.map((s, idx) => ({ value: String(idx), label: `${s.id} · ${s.name}` }))} />
            </TweakSection>
            <TweakSection label="Quick pick">
              {SCENES.map((s, idx) => (
                <TweakButton key={s.id}
                  label={`${idx === i ? '●' : '○'}  ${s.id} · ${s.name}`}
                  secondary={idx !== i}
                  onClick={() => setTweak('sceneIndex', idx)} />
              ))}
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Splash/>);
  </script>
</body>
</html>
