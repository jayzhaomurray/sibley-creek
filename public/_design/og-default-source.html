<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Sibley Creek — OG card render source</title>

    <!--
      Source HTML for the default Open Graph card.

      Spec: design/_specs/og_card_default.md
      Render target: public/og-default.png at 1200x630.
      Rendered by: scripts/render_og_card.mjs (Playwright + Chromium).

      Discipline:
        - Absolute-px positioning. No responsive CSS, no flex, no rem.
          The screenshot pipeline relies on deterministic pixel rails.
        - Bare HTML document, no project chrome, no BaseLayout.
        - Inline CSS, inline SVG, no external project dependencies.
          Only external resource is Google Fonts for Manrope, which is
          already a project dependency (src/styles/fonts.css).
        - Pure Vignelli palette: paper #FFFFFF, ink #000000, signal red
          #E63946 only on the Sleeping Giant mark's foot-terminus dot.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;900&display=swap"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        font-family: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* The card canvas. Absolute 1200x630 — the Playwright viewport
       * matches this exactly. */
      .og-card {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #ffffff;
        overflow: hidden;
      }

      /* Sleeping Giant mark: 200x200, centered horizontally.
       * left = (1200 - 200) / 2 = 500.
       * top = 100.
       * Uses the favicon's abbreviated path (viewBox 0 0 32 32) per
       * project canon: the favicon's abbreviation IS the default brand
       * mark across surfaces — see memory note
       * project_default_logo_favicon_abbreviation.md. The 32x32 path
       * scales uniformly to 200x200 (6.25x). Stroke held at 3px via
       * non-scaling-stroke so it doesn't render chunky at the larger
       * size. */
      .og-card__mark {
        position: absolute;
        left: 500px;
        top: 100px;
        width: 200px;
        height: 200px;
      }
      .og-card__mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .og-card__mark .sg-line {
        fill: none;
        stroke: #000000;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .og-card__mark .sg-dot {
        fill: #e63946;
        stroke: none;
      }

      /* Wordmark: Manrope 900 / 72px / 0.14em / uppercase.
       * Centered on the canvas centerline (x=600) via translateX(-50%).
       * top = 380 — shifted down 20px from the original 360 to
       * accommodate the taller (200px) square favicon mark above
       * (vs. the original 180px-tall multi-mesa). */
      .og-card__wordmark {
        position: absolute;
        left: 50%;
        top: 380px;
        transform: translateX(-50%);
        font-family: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 72px;
        line-height: 1;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #000000;
        margin: 0;
        padding: 0;
        white-space: nowrap;
      }

      /* Tagline: Manrope 400 / 30px / normal tracking / sentence-case.
       * top = 462. Centered on x=600. */
      .og-card__tagline {
        position: absolute;
        left: 50%;
        top: 482px;
        transform: translateX(-50%);
        font-family: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 30px;
        line-height: 1.3;
        letter-spacing: 0;
        color: #000000;
        margin: 0;
        padding: 0;
        white-space: nowrap;
      }

      /* Hairline rule: 1px true black, 240px wide, centered on x=600.
       * top = 540. */
      .og-card__rule {
        position: absolute;
        left: 50%;
        top: 560px;
        transform: translateX(-50%);
        width: 240px;
        height: 1px;
        background: #000000;
      }

      /* Colophon URL: Manrope 600 / 16px / 0.18em / uppercase.
       * top = 562. Centered on x=600. */
      .og-card__url {
        position: absolute;
        left: 50%;
        top: 582px;
        transform: translateX(-50%);
        font-family: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 16px;
        line-height: 1;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #000000;
        margin: 0;
        padding: 0;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="og-card" id="og-card">
      <!--
        Sleeping Giant brand mark — favicon abbreviation (default mark).
        Path data identical to public/favicon.svg (viewBox 0 0 32 32,
        three cubic beziers, dot r=2.5 at (28, 16) in MTA signal red).
        Source-of-truth: project_default_logo_favicon_abbreviation.md.
      -->
      <div class="og-card__mark" aria-hidden="true">
        <svg
          viewBox="0 0 32 32"
          xmlns="http://www.w3.org/2000/svg"
          preserveAspectRatio="xMidYMid meet"
        >
          <path
            class="sg-line"
            d="M 2 28 C 3 22, 5 8, 8 4 C 12 4, 16 4, 20 4 C 22 4, 23 16, 24 22 C 25 22, 27 18, 28 16"
          />
          <circle class="sg-dot" cx="28" cy="16" r="2.5" />
        </svg>
      </div>

      <div class="og-card__wordmark">SIBLEY CREEK</div>

      <div class="og-card__tagline">Canadian macro. Until it&rsquo;s obvious.</div>

      <div class="og-card__rule" aria-hidden="true"></div>

      <div class="og-card__url">sibleycreek.ca</div>
    </div>
  </body>
</html>
