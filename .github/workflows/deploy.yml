name: Deploy to GitHub Pages

# Trigger on master pushes plus manual dispatch from the Actions tab.
# Site data is checked in (data/site/sections.json + panel_data/), so this
# workflow does NOT run the Python pipeline - it only builds the Astro
# site against the cached payload. The data refresh runs separately in
# build-financial-daily.yml / build-monthly.yml.
#
# Scheduled rebuild every 15 min refreshes the build-time fetches that
# live in page frontmatter: the Forex Factory calendar on /overview/
# and the "What we're reading" reporter byline feed (rss-parser against
# Google News). GHA runner IPs aren't blocked by Google News, so the
# fetch succeeds. Public-repo GHA minutes are unlimited, so 96 runs/day
# is fine. Disk caches inside each fetch (FF 6h, news 15m) gate against
# upstream rate limits.
on:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# Allow one concurrent deployment; queue subsequent pushes so a fast
# follow-up doesn't kill an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static check: every readCsv("...") / quoted "data/raw/..." reference
      # in src/ must point at a git-tracked file. Catches the failure class
      # behind the 10 broken deploys (Linux CI ENOENT on Windows-cached
      # raw CSVs). Cheap, runs before the heavy Astro build so failure is
      # fast and the error names the offending file.
      - name: Check build-time file references
        run: node scripts/check_buildtime_file_refs.mjs

      - name: Check reader-facing label budgets
        # Fails the build if any known-constrained slot (tileLine,
        # heroKicker, pageDescription) carries copy over its character
        # budget. The point is to catch silent mid-word truncation
        # BEFORE deploy rather than ship it to the live site.
        run: node scripts/check_label_budgets.mjs

      - name: Build Astro site
        # Uses package.json `build` script: `astro check && astro build`.
        run: npm run build

      - name: Install Playwright Chromium
        # Required by fix_text_overlaps.mjs + check_text_overlaps.mjs.
        # `npm ci` installs the @playwright/test package but NOT the
        # browser binary; this command pulls only Chromium and skips
        # Firefox / WebKit so the install stays small (~150 MB vs ~500 MB).
        run: npx playwright install --with-deps chromium

      - name: Auto-fix chart text-vs-line overlaps
        # Rewrites the <text y="..."> attribute on overlapping labels in
        # dist/**/*.html so they nudge into the nearest whitespace.
        # Fixes the BUILT artifact only -- source components still
        # produce overlaps; the fixer re-runs on every CI build.
        # Always exits 0; residuals are the detector's responsibility
        # to fail on. See scripts/fix_text_overlaps.mjs header for the
        # full algorithm + the v2 source-level sketch.
        run: node scripts/fix_text_overlaps.mjs

      - name: Check chart text-vs-line overlaps (residual)
        # Drives Playwright over `astro preview` and fails if any
        # <text> stroke-crosses a data-line / bar rect. Allowlist:
        # scripts/text_overlap_allowlist.json. The fixer should have
        # resolved most cases; this gate catches the unfixable subset
        # (typically labels sitting inside reference / recession bands
        # by design, which need an allowlist entry rather than a nudge).
        run: node scripts/check_text_overlaps.mjs

      # NOTE: visual regression gate temporarily disabled.
      # Playwright snapshot filenames are platform-suffixed by default
      # (`*-win32.png` for Windows local, `*-linux.png` for CI Ubuntu).
      # Baselines committed locally on Windows are not portable to Linux
      # CI without either (a) generating Linux baselines via a separate
      # workflow_dispatch + commit, or (b) configuring Playwright's
      # `snapshotPathTemplate` to strip the platform suffix. Re-enable
      # this step after either fix lands.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Failure alert: open (or refresh) a GitHub Issue when any build step
      # above fails. Covers ALL failure classes: Astro build errors and every
      # JS build-gate trip (check_tk_in_dist, check_reader_copy_leakage,
      # check_panel_data_wired, check_raw_tracked, slug-alignment, label
      # budgets, text-overlap, etc.). Uses the built-in GITHUB_TOKEN -- NO SMTP
      # secrets required. The prior dawidd6/action-send-mail step errored on
      # every failure ("Input required and not supplied: from") because
      # SMTP_FROM was never configured, so a 4-day deploy freeze (2026-06-11..15)
      # went completely unalerted. An Issue is deduped by the `deploy-failure`
      # label and self-resolves on the next green build (step below).
      - name: Open or refresh deploy-failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha.slice(0, 8);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `@jayzhaomurray — **deploy build failed** on commit \`${sha}\` (run #${context.runNumber}, trigger: ${context.eventName}).`,
              ``,
              `The site is still serving the **last successful build** — visitors see no change, but any new data/content is **NOT live** until this is fixed.`,
              ``,
              `Open the run, find the failed step, fix the cause, and push (or re-run): ${runUrl}`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "deploy-failure", per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: "🚨 Deploy build failing — site not updating",
                body,
                labels: ["deploy-failure"],
              });
            }

      # Self-resolve: when the build is green, close any open deploy-failure
      # issue so a stale alert never lingers. Runs only if such an issue exists,
      # so green runs don't spam.
      - name: Resolve deploy-failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "deploy-failure", per_page: 10,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Recovered: build green on commit \`${context.sha.slice(0,8)}\` (run #${context.runNumber}). Closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: "closed",
              });
            }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
