name: Deploy to GitHub Pages

# Trigger on master pushes plus manual dispatch from the Actions tab.
# Site data is checked in (data/site/sections.json + panel_data/), so this
# workflow does NOT run the Python pipeline - it only builds the Astro
# site against the cached payload. The data refresh runs separately in
# build-financial-daily.yml / build-monthly.yml.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; queue subsequent pushes so a fast
# follow-up doesn't kill an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static check: every readCsv("...") / quoted "data/raw/..." reference
      # in src/ must point at a git-tracked file. Catches the failure class
      # behind the 10 broken deploys (Linux CI ENOENT on Windows-cached
      # raw CSVs). Cheap, runs before the heavy Astro build so failure is
      # fast and the error names the offending file.
      - name: Check build-time file references
        run: node scripts/check_buildtime_file_refs.mjs

      - name: Check reader-facing label budgets
        # Fails the build if any known-constrained slot (tileLine,
        # heroKicker, pageDescription) carries copy over its character
        # budget. The point is to catch silent mid-word truncation
        # BEFORE deploy rather than ship it to the live site.
        run: node scripts/check_label_budgets.mjs

      - name: Build Astro site
        # Uses package.json `build` script: `astro check && astro build`.
        run: npm run build

      - name: Install Playwright Chromium
        # Required by check_text_overlaps.mjs (next step). `npm ci`
        # installs the @playwright/test package but NOT the browser
        # binary; this command pulls only Chromium and skips Firefox /
        # WebKit so the install stays small (~150 MB vs ~500 MB).
        run: npx playwright install --with-deps chromium

      - name: Check chart text-vs-line overlaps
        # Drives Playwright over `astro preview` and fails if any
        # <text> element's bounding box intersects a data-line / bar
        # rect. Exceptions live in scripts/text_overlap_allowlist.json.
        # See script header for v1 limitations and the v2 path.
        run: node scripts/check_text_overlaps.mjs

      # NOTE: visual regression gate temporarily disabled.
      # Playwright snapshot filenames are platform-suffixed by default
      # (`*-win32.png` for Windows local, `*-linux.png` for CI Ubuntu).
      # Baselines committed locally on Windows are not portable to Linux
      # CI without either (a) generating Linux baselines via a separate
      # workflow_dispatch + commit, or (b) configuring Playwright's
      # `snapshotPathTemplate` to strip the platform suffix. Re-enable
      # this step after either fix lands.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
