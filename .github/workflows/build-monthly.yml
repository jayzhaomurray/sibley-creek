# ----------------------------------------------------------------------------
# Daily macro-data refresh
# ----------------------------------------------------------------------------
#
# Pulls the StatCan / BoC / DoF / CREA / IRCC source roster once per weekday
# morning. Most days nothing new is published; the pipeline is idempotent so
# those runs produce no diff and no commit. On a release day (LFS first
# Friday, CPI third Tuesday, GDP, Fiscal Monitor, CMHC, CREA HPI, etc.) the
# refreshed CSV plus any cross-series derivation lands in a commit signed
# by the github-actions bot, pushes to master, and triggers `deploy.yml`
# to rebuild and ship the site.
#
# Per ADR-0005, the main entry point (`python -m pipeline.build`) covers:
#   - StatCan WDS catalog (GDP, Inflation, Labour, Housing, Trade)
#   - BoC Valet non-daily cadence (CPI core, expectations, mortgage rates,
#     balance sheet, output gap, CSCE, BOS)
#   - DoF Fiscal Monitor
#   - CREA MLS HPI bulk download
#   - Cross-series derivations (per-capita employment, trade balance MA,
#     partner shares, CPI Y/Y views, CPI breadth band)
#
# Cadence: Mon-Fri at 14:00 UTC. During EST that is 9:00 ET; during EDT
# 10:00 ET. StatCan releases at 8:30 ET, so this slot sits 30-90 minutes
# after the typical release window with a buffer for re-pulls if a
# scheduled release lands late. GitHub cron is UTC-only so we accept the
# one-hour DST drift.
#
# Note on cadence-vs-source-day: each StatCan release has its own day
# (LFS first Friday, CPI third Tuesday, GDP varies, Fiscal Monitor mid-
# month). Rather than orchestrate per-section workflows, we run the
# full main pipeline daily; sources that have no new data on a given
# day return the same value with the same vintage, the working tree
# stays clean, and the commit step is a no-op. Cheap and simple.

name: build-data-daily

on:
  schedule:
    # Mon-Fri at 14:00 UTC. See header note on DST trade-off.
    - cron: "0 14 * * 1-5"
  # Manual trigger is always available for ad-hoc refresh.
  workflow_dispatch: {}

concurrency:
  group: build-data-daily
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 82 StatCan vectors + BoC non-daily + DoF scrape + CREA XLSX. The
    # CREA bulk download is the slowest single step (~10s) and the
    # StatCan loop is the bulk. Generous timeout vs. ADR-0005's "slower"
    # qualifier.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `git diff --quiet` in the commit step
          # compares against the actual last-commit state, not a shallow
          # snapshot.
          fetch-depth: 0
          # Use a token with push scope so the post-build commit can be
          # pushed back to master. GITHUB_TOKEN gets `contents: write`
          # from the `permissions:` block above.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/requirements.txt

      - name: Set up Node for integrity check
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies (for integrity check)
        run: npm ci

      - name: Verify declared print inputs are git-tracked
        # Fast-fail BEFORE the build. An untracked declared input
        # (data/raw/* is gitignored) is absent in this clean checkout, would
        # silently drop its print, and freeze the deploy at the leakage gate.
        # Also runs inside pipeline.build; this surfaces it early. See
        # pipeline/io/input_tracking.py.
        run: |
          python -m pipeline.io.input_tracking

      - name: Run main pipeline build
        env:
          # FRED is invoked by `build_financial`, not `build`; passed
          # through for parity in case build.py picks up FRED series in
          # future iterations.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python -m pipeline.build

      - name: Validate panel data integrity
        # Catches NaN/Infinity/stale data BEFORE commit to master.
        run: |
          node scripts/check_panel_data_integrity.mjs

      - name: Commit and push refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed data/derived data/site
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit + push."
          else
            git commit -m "data: daily macro refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # Pull-rebase before push in case master moved while the
            # build was running (e.g., a manual push from the user).
            # If rebase fails, surface and bail; the next cron will retry.
            git pull --rebase origin master
            git push origin HEAD:master
            echo "Pushed to master; deploy.yml will rebuild and ship."
          fi

      # Failure alert: open (or refresh) a GitHub Issue when any step above
      # fails -- most importantly "Run main pipeline build" (python -m
      # pipeline.build), which is fail-loud by design: a single fetcher
      # exception fails the whole run and skips the commit, so ALL data
      # refreshes for the day are blocked, not just the broken series.
      #
      # This step exists because it didn't before: a hardcoded absolute
      # path in pipeline/fetch/cpi_components.py (pointing at a file that
      # only existed on the author's own machine) broke this exact step on
      # every scheduled weekday run from 2026-05-20 through 2026-07-17 --
      # two months -- with zero visible signal, because SMTP_HOST/PORT are
      # not configured (pipeline/notifications/send.py skips cleanly rather
      # than raising, by design, so it can't be the alert channel here).
      # Mirrors the same pattern already in deploy.yml (added after that
      # workflow's own 4-day unalerted freeze, 2026-06-11..15). Uses the
      # built-in GITHUB_TOKEN; no SMTP secrets required. Deduped by the
      # `data-refresh-failure` label; self-resolves on the next green run.
      - name: Open or refresh data-refresh-failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha.slice(0, 8);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `@jayzhaomurray — **build-data-daily failed** on commit \`${sha}\` (run #${context.runNumber}, trigger: ${context.eventName}).`,
              ``,
              `Because \`pipeline.build\` fails loud on any single fetcher error, this blocks the commit-and-push step entirely -- no series refreshed today, not just the broken one.`,
              ``,
              `Open the run, find the failed step (usually "Run main pipeline build"), and check the log for \`ERROR pipeline.build FAILED: <source> -- <exception>\`: ${runUrl}`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "data-refresh-failure", per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: "Data refresh failing — dashboard sections going stale",
                body,
                labels: ["data-refresh-failure"],
              });
            }

      # Self-resolve: when the build is green, close any open
      # data-refresh-failure issue so a stale alert never lingers.
      - name: Resolve data-refresh-failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "data-refresh-failure", per_page: 10,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Recovered: build green on commit \`${context.sha.slice(0,8)}\` (run #${context.runNumber}). Closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: "closed",
              });
            }
