# ----------------------------------------------------------------------------
# Monthly main build (ADR-0005 sibling of the daily Financial workflow)
# ----------------------------------------------------------------------------
#
# STATE: READY-TO-ENABLE.
# Same posture as `build-financial-daily.yml`: this workflow is committed
# but is only meaningful once a `git remote` is configured and this branch
# lands on GitHub. Cron triggers only fire on the default branch of the
# repository on github.com.
#
# Per ADR-0005, the monthly entry point (`python -m pipeline.build`) covers:
#   - StatCan WDS catalog (GDP, Inflation, Labour, Housing, Trade)
#   - BoC Valet non-daily cadence (CPI core, expectations, mortgage rates,
#     balance sheet, output gap)
#   - DoF Fiscal Monitor (monthly, ~2-month lag)
#   - CREA MLS HPI bulk download (monthly, ~3-week lag)
#   - Cross-series derivations (per-capita employment, trade-balance MA,
#     partner shares, CPI Y/Y views)
#
# Cadence: 1st of each month at 13:00 ET (17:00 UTC during EST, 18:00 UTC
# during EDT). GitHub cron is UTC-only so we cannot follow DST exactly; we
# fix the slot to 17:00 UTC, which is 13:00 ET during EST and 13:00 EDT-1h
# (= 12:00 ET) during summer. This is fine for monthly cadence: the 1st of
# a typical month is far enough from any release-day pressure that a one-
# hour drift doesn't matter. StatCan releases for the calendar month are
# spread across the month, not all on the 1st; this slot just refreshes
# everything that landed during the previous month plus the Fiscal Monitor
# and CREA HPI.
#
# Why not align to StatCan release days? Each StatCan release has its own
# day (LFS first Friday, CPI third Tuesday, GDP varies). Running on each
# release day requires per-section orchestration; for v1 the single-cadence
# monthly refresh is the simpler operational choice. We can split out
# release-day workflows in a future iteration once the v1 site is shipping.

name: build-monthly

on:
  schedule:
    # 1st of each month at 17:00 UTC. See header note on DST trade-off.
    - cron: "0 17 1 * *"
  # Manual trigger is always available for ad-hoc refresh.
  workflow_dispatch: {}

concurrency:
  group: build-monthly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 82 StatCan vectors + BoC non-daily + DoF scrape + CREA XLSX. The
    # CREA bulk download is the slowest single step (~10s) and the
    # StatCan loop is the bulk. Generous timeout vs. ADR-0005's "slower"
    # qualifier.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/requirements.txt

      - name: Run monthly main build
        env:
          # FRED is invoked by `build_financial`, not `build`; we still
          # pass it through for parity in case build.py picks up FRED
          # series in future iterations.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        continue-on-error: true
        id: build
        run: |
          python -m pipeline.build

      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit."
          else
            git commit -m "data: monthly main refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "Committed in-place. NOT pushing (no remote configured)."
          fi

      - name: Surface non-zero build outcome
        if: steps.build.outcome != 'success'
        run: |
          echo "Monthly main build reported failures; see the build step log."
          exit 1
