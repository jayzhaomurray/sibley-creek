# ----------------------------------------------------------------------------
# Daily macro-data refresh
# ----------------------------------------------------------------------------
#
# Pulls the StatCan / BoC / DoF / CREA / IRCC source roster once per weekday
# morning. Most days nothing new is published; the pipeline is idempotent so
# those runs produce no diff and no commit. On a release day (LFS first
# Friday, CPI third Tuesday, GDP, Fiscal Monitor, CMHC, CREA HPI, etc.) the
# refreshed CSV plus any cross-series derivation lands in a commit signed
# by the github-actions bot, pushes to master, and triggers `deploy.yml`
# to rebuild and ship the site.
#
# Per ADR-0005, the main entry point (`python -m pipeline.build`) covers:
#   - StatCan WDS catalog (GDP, Inflation, Labour, Housing, Trade)
#   - BoC Valet non-daily cadence (CPI core, expectations, mortgage rates,
#     balance sheet, output gap, CSCE, BOS)
#   - DoF Fiscal Monitor
#   - CREA MLS HPI bulk download
#   - Cross-series derivations (per-capita employment, trade balance MA,
#     partner shares, CPI Y/Y views, CPI breadth band)
#
# Cadence: Mon-Fri at 14:00 UTC. During EST that is 9:00 ET; during EDT
# 10:00 ET. StatCan releases at 8:30 ET, so this slot sits 30-90 minutes
# after the typical release window with a buffer for re-pulls if a
# scheduled release lands late. GitHub cron is UTC-only so we accept the
# one-hour DST drift.
#
# Note on cadence-vs-source-day: each StatCan release has its own day
# (LFS first Friday, CPI third Tuesday, GDP varies, Fiscal Monitor mid-
# month). Rather than orchestrate per-section workflows, we run the
# full main pipeline daily; sources that have no new data on a given
# day return the same value with the same vintage, the working tree
# stays clean, and the commit step is a no-op. Cheap and simple.

name: build-data-daily

on:
  schedule:
    # Mon-Fri at 14:00 UTC. See header note on DST trade-off.
    - cron: "0 14 * * 1-5"
  # Manual trigger is always available for ad-hoc refresh.
  workflow_dispatch: {}

concurrency:
  group: build-data-daily
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 82 StatCan vectors + BoC non-daily + DoF scrape + CREA XLSX. The
    # CREA bulk download is the slowest single step (~10s) and the
    # StatCan loop is the bulk. Generous timeout vs. ADR-0005's "slower"
    # qualifier.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `git diff --quiet` in the commit step
          # compares against the actual last-commit state, not a shallow
          # snapshot.
          fetch-depth: 0
          # Use a token with push scope so the post-build commit can be
          # pushed back to master. GITHUB_TOKEN gets `contents: write`
          # from the `permissions:` block above.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/requirements.txt

      - name: Set up Node for integrity check
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies (for integrity check)
        run: npm ci

      - name: Run main pipeline build
        env:
          # FRED is invoked by `build_financial`, not `build`; passed
          # through for parity in case build.py picks up FRED series in
          # future iterations.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        continue-on-error: true
        id: build
        run: |
          python -m pipeline.build

      - name: Validate panel data integrity
        # Catches NaN/Infinity/stale data BEFORE commit to master.
        continue-on-error: true
        id: integrity
        run: |
          node scripts/check_panel_data_integrity.mjs

      - name: Commit and push refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed data/derived data/site
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit + push."
          else
            git commit -m "data: daily macro refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # Pull-rebase before push in case master moved while the
            # build was running (e.g., a manual push from the user).
            # If rebase fails, surface and bail; the next cron will retry.
            git pull --rebase origin master
            git push origin HEAD:master
            echo "Pushed to master; deploy.yml will rebuild and ship."
          fi

      - name: Surface non-zero build outcome
        if: steps.build.outcome != 'success' || steps.integrity.outcome != 'success'
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "Main pipeline build reported failures; see the build step log."
          fi
          if [ "${{ steps.integrity.outcome }}" != "success" ]; then
            echo "Panel data integrity check FAILED -- NaN/Infinity/stale data detected."
          fi
          exit 1
