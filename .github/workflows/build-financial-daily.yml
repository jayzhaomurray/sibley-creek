# ----------------------------------------------------------------------------
# Daily Financial-section build (ADR-0005)
# ----------------------------------------------------------------------------
#
# STATE: READY-TO-ENABLE.
# This workflow file is committed but the schedule is NOT yet active in any
# meaningful sense, because the repository has no `git remote` configured at
# the time of writing. GitHub will only execute `schedule:` triggers on the
# repository's default branch on github.com. Once a remote is added and this
# branch is pushed to it, the cron starts firing automatically.
#
# Per ADR-0005: daily-cadence Financial sources (BoC Valet daily series,
# FRED, Yahoo) refresh every North American trading day. We run at 22:00 UTC
# (18:00 ET during EDT; 17:00 ET during EST -- close enough; do not pin to
# DST since GitHub crons are UTC-only) on weekdays only. The hand-off note
# in `research/wave1_data_scope_financial_trade.md` Section 1.3 fixes the
# 18:00 ET post-close run as the operational target.
#
# This workflow does NOT push to remote. It commits in-place and leaves the
# push to a follow-up workflow once the remote is wired up. Pushing on a
# schedule from a workflow requires a deploy token with write scope; we
# defer that decision until the remote lands.
#
# Failure handling:
#   - `python -m pipeline.build_financial` exits non-zero if any series failed
#     or if panel-data integrity fails.
#   - The workflow stops before the commit step on any failure. Partial
#     refreshes are not pushed to master, because a stale-but-valid data commit
#     is the recurrence path this gate is designed to kill.

name: build-financial-daily

on:
  schedule:
    # Mon-Fri at 22:00 UTC == 18:00 EDT / 17:00 EST. North American
    # equities + FX + Treasuries are all closed by this time.
    - cron: "0 22 * * 1-5"
  # Manual trigger is always available; useful for testing the workflow
  # against the live APIs once a remote is configured.
  workflow_dispatch: {}

# Single-shot lane: never overlap two daily Financial runs. If yesterday's
# run is still going for some reason, cancel it before starting today's.
concurrency:
  group: build-financial-daily
  cancel-in-progress: true

permissions:
  # Read default; the commit step bumps to write only for the data/processed
  # directory via the workflow-token. No package or PR perms needed.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # well over the expected ~1 minute per ADR-0005

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need full history so the commit step's `git diff --quiet`
          # compares against the actual last-commit state, not a shallow
          # snapshot.
          fetch-depth: 0
          # Token with push scope so the post-build commit can be pushed
          # back to master. GITHUB_TOKEN gets `contents: write` from the
          # `permissions:` block above.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip downloads keyed on the requirements file; rebuilds
          # only when the lockable surface changes.
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/requirements.txt

      - name: Set up Node for integrity check
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies (for integrity check)
        run: npm ci

      - name: Verify declared print inputs are git-tracked
        # Fast-fail BEFORE the long fetch run. An untracked declared input
        # (data/raw/* is gitignored) is absent in this clean checkout, would
        # silently drop its print, and freeze the deploy at the leakage gate.
        # The same check also runs inside pipeline.build_financial; this step
        # surfaces it early and visibly. See pipeline/io/input_tracking.py.
        run: |
          python -m pipeline.io.input_tracking

      - name: Run daily Financial build
        env:
          # Secrets are pulled from the repository's Settings -> Secrets.
          # Exit policy for a missing FRED_API_KEY (ratified 2026-06-09,
          # markets audit F3): WARN AND CONTINUE. Hard-failing on the
          # missing key blocked the commit step for ALL sources -- 8 silent
          # failures accumulated 2026-05-30..06-09 during which no BoC /
          # Yahoo refresh landed either. The loudness now comes from the
          # right place: FRED-backed series (us_2yr, us_10yr,
          # goc_ust_spread_*) are in the integrity gate's fail-closed
          # staleness set, so a persistently-missing key fails this
          # workflow within days, naming the stale series, while the other
          # sources keep refreshing in the meantime.
          # SMTP notification secrets are NOT configured for this repo; the
          # pipeline's failure-notification path logs a warning and skips
          # cleanly when SMTP_HOST/SMTP_PORT are absent (see
          # pipeline/notifications/send.py).
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python -m pipeline.build_financial

      - name: Validate panel data integrity
        # Runs AFTER the financial build writes panel_data/*.json.
        # Catches NaN/Infinity/stale data BEFORE it is committed to master
        # and deployed to the live site. This is the systemic gate that
        # prevents the recurring broken-chart class of bug.
        run: |
          node scripts/check_panel_data_integrity.mjs

      - name: Validate raw/meta git tracking
        # The fetch step above just wrote .meta.json sidecars to data/raw.
        # If any sidecar of a tracked CSV is not itself tracked, clean
        # checkouts rebuild degraded panel data (frequency falls back to
        # "monthly", source nulls -- markets audit F4). Fail here, before
        # the commit step can propagate the gap.
        run: |
          node scripts/check_raw_tracked.mjs

      - name: Commit and push refreshed data if changed
        # Only commits when the working tree actually diverges from HEAD.
        # `git diff --quiet` returns non-zero if there are unstaged
        # differences; we add new + modified files under data/, then
        # check the index against HEAD. On a non-empty diff, commit and
        # push to master; the push triggers deploy.yml to rebuild and
        # ship the site.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed data/derived data/site
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit + push."
          else
            git commit -m "data: daily financial refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # Pull-rebase before push in case master moved while the
            # build was running. If rebase fails, surface and bail; the
            # next cron will retry.
            git pull --rebase origin master
            git push origin HEAD:master
            echo "Pushed to master; deploy.yml will rebuild and ship."
          fi
