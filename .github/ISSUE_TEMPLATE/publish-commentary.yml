name: Publish a data commentary
description: Upload a finished commentary PDF and publish it to the live site.
labels: ["publish-commentary"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in and submit. The site publishes itself within a few
        minutes — you'll get a comment on this issue with the live link
        when it's done (or a note if something went wrong; the live site
        is never touched unless everything checks out).

        **Use the "Title" box above (at the very top of this page) for
        the headline** — exactly as it should appear on the site. There
        is no separate title question below; that box IS the headline.
  - type: dropdown
    id: section
    attributes:
      label: Section
      description: Which topic is this commentary about?
      options:
        - Output
        - Inflation
        - Labour
        - Housing
        - Monetary
        - Fiscal
        - Trade
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Publish date
      description: "Format: YYYY-MM-DD"
      placeholder: "2026-07-27"
    validations:
      required: true
  - type: textarea
    id: excerpt
    attributes:
      label: Excerpt
      description: One or two sentences previewing the take. Plain text, no formatting.
    validations:
      required: true
  - type: dropdown
    id: byline
    attributes:
      label: Byline
      description: Who wrote this one?
      options:
        - Thompson Richards
        - Jay Zhao-Murray
    validations:
      required: true
  - type: textarea
    id: pdf
    attributes:
      label: PDF
      description: Drag your finished PDF file into this box.
    validations:
      required: true
