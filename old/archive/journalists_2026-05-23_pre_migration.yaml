# business/blast/journalists.yaml
# Journalist blast list for Sibley Creek commentary outreach.
#
# Fields:
#   first_name  - Used in the salutation ("Hi Paul,")
#   last_name   - Used in display name in log / headers
#   email       - Recipient address. Verify before setting active: true.
#   outlet      - Publication name (appears in log, not in email)
#   beat        - Subject-matter focus (internal reference only)
#   active      - MUST be true to receive a blast. Default: false.
#                 Jay opts in per-blast by flipping this flag.
#   notes       - Optional one-liner inserted into the email body via
#                 {{notes}} slot. Leave blank ("") to omit.
#   added       - ISO date this entry was added (audit trail)
#
# IMPORTANT: This file is gitignored (lives under business/). Never commit it.
# Re-verify email addresses before each blast cycle.

