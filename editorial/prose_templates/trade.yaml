section: trade

slots:
  exports: trade_exports_all_customs
  imports: trade_imports_all_customs
  us_exports: trade_exports_us_customs
  gold: exports_gold_total

surfaces:
  tileline:
    required: true
    variants:
      - when: 'true'
        text: "Goods exports {latest(exports)|cadb_from_m}; imports {latest(imports)|cadb_from_m}; US-bound exports {latest(us_exports)|cadb_from_m}; gold exports {latest(gold)|cadb_from_m}."
