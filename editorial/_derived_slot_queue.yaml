# Derived-slot materialization queue
#
# Every time the fact-checker has to compute a derived series ad-hoc
# (because no slot exists in data/site/panel_data/*.json for it), the
# agent appends an entry to this file with the aggregation rule used.
# Backend (or user) picks items off the queue and materializes them in
# pipeline/io/panel_data.py + pipeline/io/site_data.py.
#
# Once materialized: delete the entry. Next time a similar claim
# appears, the fact-checker reads the slot value directly. No
# re-derivation ever happens twice.
#
# Convergence: every ad-hoc computation gets done exactly once. The
# system gets more deterministic with every audit cycle.
#
# Entry schema:
#   slot_name:         proposed slug for the new slot (backend can rename)
#   added_at:          ISO date the entry was logged
#   surface:           where the claim that triggered this lives (page + plate)
#   source_inputs:     list of raw files / panel slots the derivation reads
#   aggregation_rule:  one-line precise description of how the value is computed
#                      (sampling convention, alignment, units)
#   example_values:    a few {date, value} sample points so backend can sanity-
#                      check the materialization matches
#   status:            pending_materialization | materialized | rejected

queue:

  - slot_name: boc_fed_spread_monthly
    added_at: 2026-05-13
    surface: policy plate-2 (BoC vs Fed policy paths)
    source_inputs:
      - data/raw/overnight_rate_target.csv  # BoC monthly, month-end values
      - data/raw/fed_funds.csv               # Fed daily, target upper bound
    aggregation_rule: >
      For each calendar month M: take the BoC overnight rate value at month-end
      (last row in overnight_rate_target.csv falling in M) minus the Fed funds
      target upper-bound value at the last daily observation in M
      (last row in fed_funds.csv falling in M). Express as bps (multiply pp by 100).
      Use month-end alignment to avoid intra-month transient spikes between
      sequential BoC/Fed announcement days.
    example_values:
      - { date: "2025-02-28", value: -150 }
      - { date: "2025-08-31", value: -175 }
      - { date: "2025-11-30", value: -175 }
      - { date: "2025-12-31", value: -150 }
      - { date: "2026-04-30", value: -150 }
    status: materialized
    materialized_at: 2026-05-13
    materialized_as: data/processed/boc_fed_spread_monthly.csv
    wired_to: policy panel-2 tertiary slot

  - slot_name: housing_starts_12mma
    added_at: 2026-05-13
    surface: housing plate-2 (Panel2Activity.astro, left sub-panel)
    source_inputs:
      - data/site/panel_data/housing.json panel-2 primary (housing_starts, monthly SAAR)
    aggregation_rule: >
      For each month T in the windowed (2016+) series: arithmetic mean of the
      12 most recent valid monthly values ending at T (including T).
      Observations with null/NaN values are skipped; if fewer than 12 valid
      observations exist, the output for that T is null (warm-up period).
      Units: thousands SAAR, same as the raw series.
    example_values:
      - { date: "2025-03-01", approx: 233.5 }
      - { date: "2026-03-01", approx: 228.0 }
    status: in_component_deferred
    notes: >
      Computation lives in Panel2Activity.astro frontmatter (rollingMean helper,
      n=12). Materializing to a pipeline slot is the correct long-term state;
      deferred because this component is a bespoke Tier-3 chart (not a PanelLiveChart
      consumer) and the in-component computation is idempotent on every build.
      Backend: materialize when housing pipeline is next touched. Then delete
      this entry and the in-component helper.
    in_component_fallback: Panel2Activity.astro rollingMean(startsRaw, 12)

  - slot_name: units_under_construction_4qma
    added_at: 2026-05-13
    surface: housing plate-2 (Panel2Activity.astro, right sub-panel)
    source_inputs:
      - data/site/panel_data/housing.json panel-2 secondary (units_under_construction, quarterly SAAR)
    aggregation_rule: >
      For each quarter T in the windowed (2016+) series: arithmetic mean of the
      4 most recent valid quarterly values ending at T (including T).
      This is the quarterly-grain equivalent of a 12-month moving average.
      Observations with null/NaN values are skipped; if fewer than 4 valid
      observations exist, the output for that T is null (warm-up period).
      Units: thousands SAAR, same as the raw series.
    example_values:
      - { date: "2025-10-01", approx: 262.0 }
      - { date: "2026-01-01", approx: 255.5 }
    status: in_component_deferred
    notes: >
      Computation lives in Panel2Activity.astro frontmatter (rollingMean helper,
      n=4). Materializing to a pipeline slot is the correct long-term state;
      deferred because this component is a bespoke Tier-3 chart and the quarterly
      series has only ~4 obs/year. Backend: materialize when housing pipeline is
      next touched. Then delete this entry and the in-component helper.
    in_component_fallback: Panel2Activity.astro rollingMean(ucRaw, 4)

  - slot_name: cpi_headline_mm_nsa
    added_at: 2026-05-19
    surface: inflation plate-1 (Headline CPI, m/m and Y/Y) — "0.4% unadjusted" claim
    source_inputs:
      - data/raw/cpi_all_items_nsa.csv  # StatCan headline CPI NSA index level, monthly
    aggregation_rule: >
      For each month T in the series: (level_T / level_{T-1} - 1) * 100,
      expressed as a percentage with one decimal place rounding. NSA, raw
      index. No seasonal-adjustment applied. Matches the m/m print StatCan
      publishes in The Daily commentary on each CPI release.
    example_values:
      - { date: "2026-02-01", value: 0.5 }  # 165.9 / 165.0 - 1 = 0.55%
      - { date: "2026-03-01", value: 0.9 }  # 167.4 / 165.9 - 1 = 0.90%
      - { date: "2026-04-01", value: 0.4 }  # 168.0 / 167.4 - 1 = 0.36%
    status: materialized
    materialized_at: 2026-05-19
    materialized_as: data/processed/cpi_all_items_nsa_mm.csv
    wired_to: derive_cpi_views (pipeline/build.py)
    notes: >
      Cited in src/pages/inflation.astro plate-1 with `source: pipeline:statcan:18-10-0004-01`
      and a fact-checker-flag note. Verified for the April 2026 print against
      StatCan release commentary (0.4% NSA m/m) and Jay's published commentary
      (cpi-2026-05-19.pdf). Computed in derive_cpi_views as periods=1 pct_change
      on the cpi_all_items_nsa raw level.

  - slot_name: dof_fiscal_ytd_balance_yoy_delta
    added_at: 2026-05-25
    surface: /fiscal/ section abstract (sections.ts L558) — "$6.3 billion wider than the same point last year" claim
    source_inputs:
      - DoF Fiscal Monitor Feb 2026 print (YTD Apr 2025 through Feb 2026 = -$25.5bn)
      - DoF Fiscal Monitor Feb 2025 print (YTD Apr 2024 through Feb 2025 = -$19.3bn, NOT YET VERIFIED)
    aggregation_rule: >
      Federal budgetary YTD balance through February of fiscal year N minus
      the YTD balance through February of fiscal year N-1; report signed delta
      in CAD billions. Both anchors taken from the Fiscal Monitor "Year-to-date"
      column for the eleven-month period running April through February.
    example_values:
      - { current_ytd_cad_bn: -25.5, prior_ytd_cad_bn: -19.3, delta_cad_bn: -6.3 }
    status: rejected
    rejected_at: 2026-05-25
    rejected_reason: >
      Abstract was rephrased to drop the specific $6.3bn delta (now reads
      "wider than the same point last year"). Slot is unnecessary unless the
      delta is re-added. Background researcher is verifying $19.3bn against
      Feb 2025 Fiscal Monitor via alternative routes; if confirmed, re-open
      this entry (status pending_materialization) and restore the specific
      delta to the abstract.
