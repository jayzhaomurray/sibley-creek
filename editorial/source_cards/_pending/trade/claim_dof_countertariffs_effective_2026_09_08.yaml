notes: |
  Fetched 2026-10-03T17:11:28Z (HTTP 200, browser User-Agent via curl; Python
  requests gets a connection reset from www.canada.ca); excerpt string-matched
  against the page text after normalising non-breaking spaces. Page metadata
  dcterms.issued = 2026-08-25. The release is forward-looking ("will impose").
  That the tariffs took effect on September 8 is corroborated by the White
  House fact sheet of September 8, 2026: "today Canada imposed new retaliatory
  tariffs on about $20 billion of U.S. exports".
  The two governments quote different coverage values: Canada says $27.6
  billion, the White House about $20 billion. Neither states a currency; the
  gap is consistent with Canadian versus US dollars, but that is an inference,
  not a sourced fact. us_imports_covered_cad_bn is from the same page: "counter
  tariffs will apply to products covering $27.6 billion in imports from the
  U.S."
