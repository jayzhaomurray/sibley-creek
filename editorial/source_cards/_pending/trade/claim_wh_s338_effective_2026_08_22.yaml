notes: |
  Fetched 2026-10-03T17:11:25Z (HTTP 200); excerpt string-matched against the
  page text with HTML tags stripped and whitespace collapsed. The August 18,
  2026 date comes from the White House site listing of this proclamation (shown
  on the July 20 fact-sheet page), not from the proclamation body.
  The card supports the scheduled effective date only; it does not by itself
  show that duties were collected from that date. Department of Finance Canada,
  in its August 25, 2026 release, separately describes the US tariff as
  "effective August 22".
  Relevance for the trade section: these tariffs post-date the July 2026 trade
  data, so no published trade figure reflects them yet.
