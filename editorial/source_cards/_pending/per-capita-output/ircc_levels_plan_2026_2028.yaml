excerpt: "The 2026-2028 Immigration Levels Plan stabilizes permanent resident admissions at 380,000 per year for 2026, 2027 and 2028. Targets for new temporary resident arrivals are set at 385,000 in 2026 and 370,000 in 2027 and 2028. Study permit admissions are set at 155,000 in 2026 and 150,000 in 2027 and 2028. Temporary Foreign Worker Program targets are 60,000 in 2026 and 50,000 in 2027-2028; International Mobility Program targets are 170,000 annually."
