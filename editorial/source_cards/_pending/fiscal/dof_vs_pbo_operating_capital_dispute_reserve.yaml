  vintage_mismatch_warning: >
    The DoF operating-balance series is SEU 2026 (Apr 2026); the PBO recast is of
    Budget 2025 (Nov 2025). They are NOT a clean same-vintage year-by-year delta.
    A naive vertical-distance read mixes the classification dispute with ~$11.5bn
    of better fiscal news booked between Budget 2025 and the SEU. No published PBO
    document recasts the SEU 2026 operating balance year-by-year (NT-2627-002-S
    covers debt/sustainability/interest burden, not an operating-balance recast).
