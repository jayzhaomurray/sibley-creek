notes: |
  RESERVE CARD: gathered-but-unused data points moved off the live card 2026-06-05.
  Not cited anywhere; verify just-in-time when first cited.

  Holds the SEU-vintage DoF operating-balance track (not plotted on the plate-2
  chart, which uses the same-vintage Budget-2025-presented pair) plus the
  capital-total wedge components (311.5 / 217.3 / $94bn / 30% / capital path
  endpoints) and the vintage-mismatch warning, which concerns the SEU-vs-recast
  comparison living here rather than the same-vintage pair on the live card.

  MOVED FROM LIVE CARD 2026-06-05 (SEU-vintage / capital-total / vintage-mismatch
  material that does not belong with the same-vintage Budget-2025 pair):

  - If the SEU DoF operating-balance line is ever plotted against the PBO recast, it
    must be labelled "DoF, Spring Update 2026" against "PBO recast of Budget 2025,"
    with an explicit vintage-seam note. A naive vertical-distance read mixes the
    classification dispute with ~$11.5bn of better fiscal news booked between
    Budget 2025 and the SEU -- do NOT present that year-by-year gap as pure
    classification effect.
  - Do NOT reconstruct a Budget-2025 DoF operating-balance line from A1.5 -- it is
    not a naive revenues-minus-expenses subtraction (it nets capital revenues back
    in; 511.5 - 544.3 = -32.8 != stated -26.4; the 6.5 capital-revenue line closes
    it).
  - The $94bn capital-classification wedge here is the capital-total form (Table 3:
    311.5 reported vs 217.3 PBO-recast); on the live card the same $94bn appears as
    the cumulative sum of the same-vintage operating-pair bar gaps.
