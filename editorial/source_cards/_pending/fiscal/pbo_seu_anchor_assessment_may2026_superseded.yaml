notes: |
  Fetched by main Claude (dispatcher) 2026-06-04 directly from the PBO
  publication page. Key editorial fact: as of May 2026 the PBO's standing
  position is that it CANNOT verify the operating-balance anchor because the
  government has not disclosed the definitions used to classify operating vs
  capital. This is FRESHER than the Nov 2025 recast (RP-2526-017-S) as a
  statement of PBO's current position, but contains NO updated year-by-year
  recast — RP-2526-017-S remains the only quantified recast. The June 2026 EFO
  (RP-2627-002-S) defers an independent anchor assessment to a future report.
  Chain of PBO positions: Nov 2025 quantified recast → May 2026 cannot-verify →
  June 2026 assessment deferred.
