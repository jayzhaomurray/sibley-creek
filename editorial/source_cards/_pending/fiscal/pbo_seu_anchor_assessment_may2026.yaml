title: "Parliamentary Budget Officer — PBO Assessment of Spring Economic Update: Fiscal Anchors and Fiscal Sustainability (NT-2627-002-S)"
url: "https://www.pbo-dpb.ca/en/publications/NT-2627-002-S--pbo-assessment-spring-economic-update-fiscal-anchors-fiscal-sustainability--evaluation-dpb-mise-jour-economique-printemps-cibles-budgetaires-viabilite-financiere"
anchor: ""
excerpt: |
  "it is not possible to advise in depth as to how updates to specific revenue
  and expenditure items presented in the SEU contribute to the government's
  assertion that this fiscal anchor remains in balance."
  "No additional insights on the definitions used for classification under the
  framework were provided in terms of key concepts of capital expenditures."
  The note records that the Government is projected (on its own figures) to meet
  its Budget 2025 target of balancing operating spending with revenues by
  2028-29, with SEU operating deficits on average $1.2 billion lower than in
  Budget 2025 over 2025-26 to 2029-30.
