excerpt: |
  PBO Budget 2025: Issues for Parliamentarians (release date Nov 14, 2025;
  publication ID RP-2526-017-S; PDF distribution URL:
  https://distribution-a617274656661637473.pbo-dpb.ca/190ba7d3612031a7e15f5b45833a685e0e579add5a40fc0d2730ef043aeea0b1):

  CAPITAL INVESTMENT RECLASSIFICATION: "Budget 2025 records capital investments
  rising from $32.2 billion in 2024-25 to about $59.6 billion by 2029-30." Under
  PBO's capital definition, "PBO projects Ottawa's actual investment spending
  will be $217.3 billion from 2024-25 to 2029-30, rather than $311.5 billion" —
  approximately $94 billion (roughly 30 per cent) lower than the Government's
  reported figure.

  OPERATING BALANCE — PBO RECLASSIFIED, YEAR-BY-YEAR (deficit, $CAD billions):
  "Using the PBO's narrower capital definition, day-to-day operating deficits
  are $10.5 billion in 2024-25, $45.8 billion in 2025-26, $25.3 billion in
  2026-27, $23.3 billion in 2027-28, $18.1 billion in 2028-29, and $17.6 billion
  in 2029-30."

  TOTAL BUDGETARY DEFICIT, BUDGET 2025 (DoF version): "$78.3 billion in
  2025-26, $65.4 billion in 2026-27, $63.5 billion in 2027-28, $57.9 billion
  in 2028-29, and $56.6 billion in 2029-30." Average over 2025-26 to 2029-30:
  $64.3 billion.

  FISCAL ANCHOR: "Only a 7.5% probability that the deficit-to-GDP ratio will
  decline in every year between 2026-27 and 2029-30."
