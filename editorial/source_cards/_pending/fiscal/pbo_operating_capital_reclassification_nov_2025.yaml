notes: |
  CONSTRAINT — DoF year-by-year operating balance (DoF's own version):

  PBO's report cites the DoF/Budget 2025 capital path at the endpoints ($32.2bn
  rising to $59.6bn over 2024-25 to 2029-30) and the DoF's total budgetary
  deficit by year. PBO does not publish DoF's claimed year-by-year OPERATING
  balance in press-accessible form — that decomposition is inside Budget 2025
  Annex 1 (the budget.canada.ca PDF, which 403s on WebFetch). The DoF
  operating balance trajectory is derivable from (a) DoF total deficit by
  year minus (b) DoF capital investment by year, but the capital investment
  year-by-year (other than the 2024-25 and 2029-30 endpoints) is not in any
  secondary I could verify.

  Recommended chart treatment for plate-5:
    - Trace 1 (verified): PBO reclassified operating deficit, year-by-year
      2024-25 through 2029-30 — fully populated from this card.
    - Trace 2 (verified): Budget 2025 total deficit, year-by-year 2025-26
      through 2029-30 — fully populated from this card.
    - Annotate: "$94B reclassification gap" — PBO moves spending from DoF's
      capital line to PBO's operating line over the six-year horizon.
    - Skip: DoF's own year-by-year "operating balance" trace as a separate
      line. The point of the chart is the PBO reclassification view; showing
      DoF's claimed operating balance alongside is editorially nice-to-have
      but unverifiable in the time we have. The framing "Carney's claimed
      capital spending vs PBO's reclassified view, and what that does to the
      operating line" can be carried entirely by the two verified traces plus
      the $94B annotation.

  Verification chain that closed:
    - PBO publication page (RP-2526-017-S): 200 OK, ID and release date
      verified.
    - PBO press release page (Nov 14, 2025): 200 OK, average deficit
      framing and operating-balance qualitative framing verified.
    - thedeepdive.ca coverage of the same release: 200 OK, verbatim
      year-by-year operating deficits AND year-by-year Budget 2025 total
      deficits AND endpoint capital investment values reproduced.
    - The Hub coverage (thehub.ca/2025/11/17): 200 OK, $94B reclassification
      headline verified, $217.3B vs $311.5B capital totals verified.
    - Investment Executive coverage: 200 OK, average $64.3B and $87B
      operating measures since FES 2024 verified.
    - PDF: FlateDecode compressed, WebFetch cannot extract.

  Tier A on the year-by-year PBO reclassified operating deficits, the
  year-by-year Budget 2025 total deficits, the $94B reclassification headline,
  and the $217.3B / $311.5B / $64.3B figures: all reproduced in PBO press
  release plus at least one institutional/credible secondary (thedeepdive,
  thehub, investmentexecutive). PBO is the primary on its own publication.

