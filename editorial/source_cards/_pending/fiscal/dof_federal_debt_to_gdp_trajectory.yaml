id: dof_federal_debt_to_gdp_trajectory
title: "Plate-6 federal debt-to-GDP — Budget 2025 Annex 1 (Chart A1.5) historical + projection through 2055"
url: "https://budget.canada.ca/2025/report-rapport/anx1-en.html"
anchor: "Chart A1.5: Long-Term Federal Debt Projections"
excerpt: |
  Chart A1.5 "Long-Term Federal Debt Projections" (Budget 2025, Annex 1, Department of
  Finance Canada) presents federal debt as percent of GDP from 1980 through 2055.
  Selected verbatim values from the chart's text-version data table:
  1980: 28.5 ; 1990: 54.3 ; 1995: 66.6 (peak) ; 1996: 65.5 ; 2000: 47.0 ;
  2007: 29.0 ; 2008: 28.2 (pre-GFC trough) ; 2019: 31.2 ; 2020: 47.2 (COVID peak) ;
  2024: 41.2 (latest actual) ; 2025: 42.4 ; 2026: 43.1 ; 2027: 43.3 ; 2028: 43.3 ;
  2029: 43.1 ; 2030: 43.2 ; 2055: 37.2.
  Year labels in the chart refer to fiscal-year-ending (e.g. "1995" = FY1994-95
  ending 31 March 1995; "2024" = FY2023-24 ending 31 March 2024). The chart also
  reports downside and upside scenario tracks for 2024 onward.
