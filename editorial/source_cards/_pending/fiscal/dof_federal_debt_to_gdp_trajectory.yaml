notes: |
  PRIMARY SOURCE VERIFIED. Budget 2025 Annex 1 was fetched cleanly via WebFetch on
  2026-05-25; Chart A1.5 text-version data table extracted in full. This is the
  closest available extract of the Department of Finance Fiscal Reference Tables
  data through the Budget 2025 lens — DoF FRT October 2025 PDF at canada.ca returns
  403 on WebFetch, and the FRT Part-1 HTML page also returns 403. Budget 2025
  Annex 1 reproduces the underlying DoF historical series (the chart's own
  attribution names DoF as source).

  Header-question scope check: this card supports a "sustainability backdrop"
  plate that contextualizes Plates 1-5 (deficit/operating-balance/PBO-DoF gap).
  The 1995 peak at 66.6 percent and the post-2007 trough at 28.2 percent are
  durable annotation anchors; the projection path (~43 percent through the
  late-2020s, drifting down to 37 percent by mid-century in the baseline) lets
  the chart show that the Carney government's "declining debt-to-GDP" commitment
  is achieved only on a multi-decade horizon, not within the five-year fiscal
  framework.

  Federal-only is the chart's scope. General-government net debt (IMF basis,
  which includes provinces, local, and CPP/QPP) is a separate concept and would
  be a Tier B card if needed — IMF Article IV staff report (URL 403 on WebFetch)
  notes Canada's general government net debt is the lowest in the G7; the
  CBC News report on the IMF Article IV is a credible secondary that
  reproduces this claim verbatim. Defer general-government addition to a
  follow-up dispatch if the plate calls for it.

  Year-label convention: chart's x-axis years are fiscal-year-ending (calendar
  year of 31-March year-end). The derived JSON below normalizes to the
  FY2024-25 label convention used elsewhere in the project so downstream code
  doesn't have to bridge two formats.

  Tier A — primary source fetched at output time, verbatim chart-data table
  recovered, year-by-year values cross-checked against multiple independent
  secondaries (Annual Financial Report 2025 confirms 41.2 percent for FY2024-25;
  Budget 2025 prose verbatim confirms 42.4 percent for FY2025-26 and 43.1
  percent for FY2029-30; PBO Sept 2025 verbatim confirms 41.7 percent for
  FY2024-25 as their own anchor reading, within 0.5pp of DoF's 41.2 percent).
verification_tier: "A"
triangulation:
  - source: "Annual Financial Report of the Government of Canada Fiscal Year 2024-2025 (Department of Finance Canada)"
    url: "https://www.canada.ca/en/department-finance/services/publications/annual-financial-report/2025.html"
    excerpt: "The accumulated deficit (the difference between total liabilities and total assets), or federal debt, stood at $1,266.5 billion at March 31, 2025, with the accumulated deficit-to-gross domestic product (GDP) ratio at 41.2 per cent, down from 42.1 per cent in the previous year."
    credibility: "Department of Finance Canada — government-of-record statement of its own fiscal position; legal disclosure"
  - source: "PBO Economic and Fiscal Outlook September 2025 (RP-2526-012-S)"
    url: "https://www.pbo-dpb.ca/en/publications/RP-2526-012-S--economic-fiscal-outlook-september-2025--perspectives-economiques-financieres-septembre-2025"
    excerpt: "The federal debt-to-GDP ratio is expected to fall to 41.7 percent in 2024-25 but, due to persistent budgetary deficits of over 1 percent of GDP, it is projected to increase from 41.7 percent in 2024-25, rising above 43 percent over the medium term. Compared to the March outlook, the federal debt-to-GDP ratio is 4.5 percentage points higher in 2029-30 and is no longer projected to be on a declining path over the medium term."
    credibility: "Officer of Parliament; independent fiscal forecaster; methodology distinct from DoF"
