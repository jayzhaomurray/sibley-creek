notes: |
  This card supersedes the prior placeholder. The 13.2% figure is the
  endpoint of a published PBO projection (RP-2627-004-S), not a
  back-of-envelope: PBO computes interest cost as a share of total revenues
  rising from 10.5% in 2024-25 to 13.2% in 2030-31, with parallel framing
  as a share of GDP rising 1.7% to 2.1%. The publication is PBO's standard
  spring review of the federal main estimates — an annual document, so
  this figure will be revised once a year.

  Verification chain that closed:
    - PBO publication page (RP-2627-004-S): 200 OK, publication ID,
      release date, and headline numerics verified.
    - Same page reproduces the verbatim "Between 2024-25 and 2030-31,
      public debt charges as a share of revenues are expected to increase
      from 10.5 to 13.2 per cent" sentence in the document summary.

  The chart anchor for plate-2 is: PBO Main Estimates 2026-27 projects
  public debt charges to rise from 10.5% of federal revenues today to
  13.2% by 2030-31. The Fiscal Monitor YTD ratio (DoF's most recent
  reported value) ties to this as the current-period observation; PBO's
  projection extends it forward to 2030-31 on a current-policy baseline.

