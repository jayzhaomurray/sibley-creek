title: "PBO Government's Expenditure Plan and Main Estimates 2026-27 — May 7, 2026 (RP-2627-004-S)"
url: "https://www.pbo-dpb.ca/en/publications/RP-2627-004-S--government-expenditure-plan-main-estimates-2026-27--plan-depenses-gouvernement-budget-principal-depenses-2026-2027"
anchor: ""
excerpt: |
  PBO Government's Expenditure Plan and Main Estimates 2026-27 (released
  May 7, 2026; publication ID RP-2627-004-S): "Between 2024-25 and 2030-31,
  public debt charges as a share of revenues are expected to increase from
  10.5 to 13.2 per cent, and as a share of GDP from 1.7 per cent to 2.1
  per cent."

  "The Main Estimates outline $502.8 billion in budgetary spending
  authorities. Voted authorities requiring Parliament's approval total
  $230.4 billion." Statutory authorities for public debt servicing total
  $53.7 billion in 2026-27, comprising $48.6 billion in interest on
  unmatured debt and $5.1 billion in other interest costs. Public debt
  charges in 2026-27 represent a $4.7 billion increase (9.5 per cent)
  compared to 2025-26 estimates.
