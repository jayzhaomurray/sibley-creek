notes: |
  Primary canada.ca PDF (https://www.canada.ca/content/dam/fin/publications/frt-trf/2025/frt-trf-25-eng.pdf)
  returns 403/timeout on bot fetches (canada.ca WAF). The IDENTICAL document is mirrored
  on publications.gc.ca (Government of Canada Publications) at F1-26-2025-eng.pdf — same
  Department of Finance imprint, same content, fetched cleanly (1.27 MB, 65 pages).
  publications.gc.ca is the official archival mirror operated by the Government of Canada.

  Extraction pipeline:
    - Downloaded PDF to data/raw/fiscal/frt_2025.pdf (curl with Referer header).
    - Parsed Tables 1 and 2 via pdfplumber (analyses/fiscal_plate2_build.py).
    - Balance column: Table 2 idx 3 pre-2008-09; idx 5 from 2008-09 onward (full accrual
      "Budgetary surplus or deficit (-)" column including net actuarial losses).
    - Output: data/derived/fiscal_balance_pct_gdp.{csv,json}, 59 rows historical.

  Verification anchors (independent cross-checks against the SEU 2026 projection card
  and the AFR 2024-25):
    - FY2024-25 = -$36.3bn / -1.2% of GDP matches SEU 2026 Annex 1 Table A1.7 row.
    - FY2020-21 = -$327.7bn / -14.8% of GDP matches the widely-reported pandemic peak.
    - FY1996-97 = -1.0% matches the Chretien-Martin near-balance year.

  Tier A: primary HTML reachable via official Government of Canada publications mirror
  (publications.gc.ca), verbatim Table 2 rows captured, multi-year values reconcile with
  independently-verified SEU 2026 projection card and Annual Financial Report 2024-25.

