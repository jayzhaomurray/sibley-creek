excerpt: |
  PBO Economic and Fiscal Outlook September 2025 (released Sept 25, 2025;
  publication ID RP-2526-012-S; PDF distribution URL:
  https://distribution-a617274656661637473.pbo-dpb.ca/e40b5816b0130180b69a3e321f211634180a563c54de15cdafa64434e2b43ad3):
  "The budgetary deficit is projected to increase sharply from $51.7 billion
  (1.7 per cent of GDP) in 2024-25 to $68.5 billion (2.2 per cent of GDP) in
  2025-26 ... Assuming no new measures are introduced and existing temporary
  measures sunset as scheduled, the budgetary deficit is expected to decline
  slightly but remain close to $60 billion through the medium term as growth
  in revenues only slightly outpaces growth in expenses."

  "Compared to PBO's March 2025 outlook, projected deficits are $26.6 billion
  higher, on average, over 2024-25 to 2029-30."

  "Reflecting increased trade uncertainty and the implementation of tariffs,
  real GDP growth is projected to average 1.2 per cent annually over 2025 and
  2026."
