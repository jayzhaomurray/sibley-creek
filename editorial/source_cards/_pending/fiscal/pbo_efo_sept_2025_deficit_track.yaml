notes: |
  CONSTRAINT — granularity of the deficit path:

  The PBO's own press release (verified at the institutional pbo-dpb.ca URL
  above) publishes the two anchor years explicitly ($51.7bn for 2024-25 and
  $68.5bn for 2025-26) and characterises the medium-term trajectory as "close
  to $60 billion" through 2029-30. PBO publishes the year-by-year deficit
  table only inside the EFO PDF, which is a FlateDecode-compressed binary
  that WebFetch could not parse. No third-party (CBC, Investment Executive,
  Globe and Mail, BNN, RBC Economics) reproduces the year-by-year medium-term
  table; all sources collapse to the "close to $60 billion through medium
  term" framing.

  Recommended chart treatment: plot the two verified anchor points (2024-25
  and 2025-26) as explicit values, plot 2026-27 through 2029-30 as a flat
  ~$60bn band with a caveat label "PBO horizon anchor ~$60bn", and add a
  methodology note explaining that the PBO's medium-term path is published
  as a path-shaped guidance rather than as a year-by-year table in
  press-accessible form. For 2030-31 the EFO does not publish — the PBO
  horizon ends at 2029-30.

  Verification chain that closed:
    - Primary publication page: pbo-dpb.ca (RP-2526-012-S) — 200 OK, title
      and publication ID verified.
    - PBO press release page: pbo-dpb.ca news-releases — 200 OK, two anchor
      year values verified verbatim.
    - Investment Executive coverage of the same release — 200 OK, full
      verbatim of the two anchor values and the "close to $60 billion"
      framing.
    - PDF: FlateDecode compressed, WebFetch cannot extract; not used as a
      source for any specific number.

  Tier A on the two anchor years (2024-25 and 2025-26) and the 1.2% GDP
  growth: PBO's own press release reproduces them. Tier B on the "close to
  $60 billion" medium-term framing: same press release uses that phrasing
  but no year-specific numbers were extractable.

