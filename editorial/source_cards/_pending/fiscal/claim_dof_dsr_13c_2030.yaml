id: claim_dof_dsr_13c_2030
claim: "Finance Canada's Spring Economic Update 2026 implies the federal debt-service ratio rises to 13.2% of revenues by FY2030-31."
title: "DoF SEU 2026 Annex 1 - debt charges reach 13.2% of revenues by 2030-31"
url: "https://budget.canada.ca/update-miseajour/2026/report-rapport/anx1-en.html"
anchor: ""
excerpt: |
  Department of Finance Canada, Spring Economic Update 2026, Annex 1, Table A1.7
  reports budgetary revenues of $613.7 billion and public debt charges of
  $80.9 billion in 2030-31.
currency_probe_url: "https://budget.canada.ca/update-miseajour/2026/home-accueil-en.html"
verified_value:
