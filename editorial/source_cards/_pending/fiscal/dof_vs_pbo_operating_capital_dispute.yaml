notes: |
  COMPOSITE INSIGHT for the new DoF-vs-PBO operating/capital plate. This card does
  not introduce any new primary number -- it assembles two already-Tier-A-verified
  cards into the single editorial unit the plate needs, and pins the one caveat that
  must travel with the chart (vintage mismatch).

  Re-fetch status, honest: the two underlying primaries (PBO RP-2526-017-S HTML and
  SEU 2026 Annex 1 HTML) were WebFetched and parsed in prior sessions -- PBO on
  24 May and 2 June 2026, SEU on 25 May and 2 June 2026 -- with multi-secondary
  triangulation on the PBO side. They could NOT be re-fetched in the session that
  authored THIS card (WebFetch was unavailable in the environment). Before the plate
  ships, the fact-checker should re-confirm both primaries are live and unrevised.
  Inheriting Tier A from the two confirmed cards; flagged for re-confirmation.

  EDITORIAL FRAMING (Mode 3 on the PBO side -- "PBO argues," not "is true"):
  The DoF operating-balance line is the government's own stated track (cite as fact).
  The PBO recast is a CONTESTED-DEFINITION view -- attribute by name ("the PBO reads
  the split more narrowly," "on the PBO's definition the operating books never reach
  balance"). The $94bn wedge is PBO's claim about DoF's classification, not an agreed
  fact. The frame test (writing-style §8c): "the PBO recasts $94bn of capital as
  operating" works honestly; "DoF misclassified $94bn" does NOT -- that asserts the
  PBO's contested view as truth and must not ship.

  Jay's editorial angle is supported: the split into two budget-balance types is a
  government framing choice, and whether spending is genuinely capital vs operating
  is exactly what PBO contests. The honest version is "the anchor is met only under
  the government's own capital definition" -- verified and defensible -- NOT "the
  government is misclassifying" stated as fact.

  CHART-BUILD CAVEAT (repeat from SOURCE_NOTES.md):
  - Cleanest: carry the dispute on the $94bn cumulative wedge (vintage-clean) and
    show the DoF SEU operating-balance line with the 2028-29 anchor crossing.
  - The PBO recast line, if plotted, must be labelled "PBO recast of Budget 2025"
    and the DoF line "DoF, Spring Update 2026," with a vintage-seam note.
  - Do NOT present the year-by-year vertical gap as pure classification effect.
  - Do NOT reconstruct a Budget-2025 DoF operating-balance line -- A1.5 is not a
    naive revenues-minus-expenses subtraction (it nets capital revenues back in;
    511.5 - 544.3 = -32.8 != stated -26.4; the 6.5 capital-revenue line closes it).
  - Do NOT assert "defence and housing reclassified" -- the $94bn rests on corporate
    tax expenditures, ITCs, and operating subsidies, not defence/housing line items.

