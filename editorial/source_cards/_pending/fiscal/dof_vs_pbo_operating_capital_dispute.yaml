id: dof_vs_pbo_operating_capital_dispute
title: "DoF vs PBO operating/capital classification dispute -- new fiscal plate insight"
url: "https://www.pbo-dpb.ca/en/publications/RP-2526-017-S--budget-2025-issues-parliamentarians--budget-2025-enjeux-parlementaires"
anchor: ""
excerpt: |
  Composite insight for the new fiscal plate on the Department of Finance vs
  Parliamentary Budget Officer disagreement over how the federal budget splits
  into operating vs capital balance. Two primary sources, both already Tier-A
  verified in prior sessions:

  (1) DoF day-to-day operating balance -- Spring Economic Update 2026, Annex 1,
  Table A1.5 (tabled 28 Apr 2026). Operating balance crosses zero in FY2028-29
  at +$0.9bn -- the fiscal-anchor year. Track: 2025-26 -26.4; 2026-27 -10.5;
  2027-28 -5.2; 2028-29 +0.9; 2029-30 +4.5; 2030-31 +6.1.
  Anchor text (verbatim): "from 2028-29 through to 2030-31, projected revenues
  are expected to more than offset day-to-day operating spending, meeting the
  government's fiscal anchor of balancing day-to-day operating spending with
  revenues."

  (2) PBO recast -- "Budget 2025: Issues for Parliamentarians," RP-2526-017-S
  (14 Nov 2025). Under PBO's narrower capital definition, day-to-day operating
  deficits are 2024-25 -10.5; 2025-26 -45.8; 2026-27 -25.3; 2027-28 -23.3;
  2028-29 -18.1; 2029-30 -17.6 -- never reaching balance over the horizon.
  PBO counts $217.3bn of genuine capital over 2024-25 to 2029-30 vs Budget
  2025's reported $311.5bn -- approximately $94 billion (~30%) lower. PBO
  reclassifies corporate income-tax expenditures, investment tax credits, and
  operating subsidies out of capital and back into operating.
currency_probe_url: "https://www.pbo-dpb.ca/en/publications"
