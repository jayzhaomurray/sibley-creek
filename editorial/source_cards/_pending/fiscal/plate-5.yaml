anchor: ""
excerpt: |
  IMF Article IV Canada 2025 Staff Report (released Jan 21, 2026; Executive Board
  consultation Jan 16, 2026): "Fiscal policy is appropriately positioned to support
  near-term adjustment to the trade shock while anchoring medium-term
  sustainability. Fiscal policy should continue to be measured, counter-cyclical,
  and flexible, with a modestly expansionary stance remaining appropriate to
  cushion softer external demand, given fiscal space supported by low net debt
  levels and contained deficits."

  OECD Economic Surveys: Canada 2025 (Volume 2025/12, May 2025): "The underlying
  government primary fiscal balance (as a percentage of potential GDP) is
  projected at 1.1% for 2022, 1.1% for 2023, 0.0% for 2024, -0.2% for 2025, and
  0.0% for 2026."
