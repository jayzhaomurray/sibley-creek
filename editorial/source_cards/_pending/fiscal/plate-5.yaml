notes: |
  ANCHOR CALL FOR JAY: Two equally citable sources, different vintages, different
  methodologies.
  - OECD numeric series: explicit "underlying primary balance / potential GDP"
    timeline (2022-2026), publishable as a single-line chart. The cleanest plate.
    But the May 2025 vintage was finalized BEFORE the 2026 Spring Economic Update
    revised the deficit track sharply lower (FY2025-26 from $78.3bn / 2.5% GDP to
    $66.9bn / 2.1% GDP); the OECD CAPB is therefore stale.
  - IMF Article IV Jan 2026 verbal call: "modestly expansionary, counter-cyclical."
    Captures the current stance read but doesn't publish a directly-citable
    CAPB time series at the same level of granularity (numbers are inside the
    PDF staff report; researcher could not extract via WebFetch — IMF PDFs 403).

  Researcher recommendation: anchor chart to OECD CAPB time series (cleanest data),
  use IMF Article IV directional call ("modestly expansionary") as the title verb,
  and add a vintage caveat: OECD May 2025; methodology footnote one click away.
  Alternative: IMF Fiscal Monitor (April + Oct 2025) publishes general government
  cyclically-adjusted balance for Canada — could substitute for OECD if Jay wants
  newer vintage and IMF-internal methodology consistency.

  Tier B because both primary PDFs (IMF and OECD) return 403 on WebFetch; verbal
  excerpts taken from IMF and OECD publication landing pages and concluding
  statements (both first-party institutional secondaries).
