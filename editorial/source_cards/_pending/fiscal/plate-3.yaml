notes: |
  ANCHOR DECISION FOR JAY: The plan reads "PBO most-recent vs DoF FES most-recent."
  There is no FES 2025 — FES 2024 (Dec 2024) was superseded by Budget 2025 (Nov 2025),
  which was itself updated by the Spring Economic Update 2026 (released April 28,
  2026). The DoF's "most-recent baseline" today is the SEU 2026. Researcher
  proposes anchoring to PBO EFO Sept 2025 vs DoF SEU 2026 (latest of each series).
  Alternative: anchor to PBO Spring Update Assessment notes (NT-2627-001-S et seq.,
  April 2026) which are PBO's response to the SEU — this gives same-vintage
  comparison but PBO assessments aren't a forecast; they're a methodology critique.
  Recommend latest-of-each (PBO EFO Sept 2025 vs DoF SEU April 2026) with a
  methodology footnote naming the vintage gap.

  Methodology footnote required: PBO and DoF use different private-sector survey
  vintages and different macro envelopes. The DoF SEU economic forecast is based on
  a private-sector survey conducted in August 2025; the PBO EFO uses its own
  staff projection updated through Sept 2025. The delta is partly methodology,
  partly forecast vintage; the chart shows the gap as the comparison Bay Street
  reads, not as a definitive "PBO is more pessimistic by $Xbn."

  Tier B because (a) the canonical PBO and budget.canada.ca URLs both 403 on
  WebFetch, (b) two independent credible secondaries (PBO press-release listing
  on pbo-dpb.ca and Canada.ca DoF news release) reproduce both vintage dates and
  the SEU deficit figures consistently.
