excerpt: |
  PBO Economic and Fiscal Outlook September 2025 (released Sept 25, 2025): projects
  the Canadian economy to grow 1.2% in both 2025 and 2026, with deficit trajectory
  diverging from the government's most recent fiscal track. DoF Spring Economic
  Update 2026 (released April 28, 2026): "The 2025-26 deficit is projected to be
  $66.9 billion - $11.5 billion lower than in Budget 2025 - or 2.1 per cent of GDP.
  For 2026-27, the deficit is projected at $65.3 billion, and by 2030-31 it is
  expected to decline to $53.2 billion."
