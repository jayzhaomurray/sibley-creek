id: claim_pbo_debt_gdp_flat_low42s
claim: "The PBO's June 2026 EFO projects its own federal debt-to-GDP track flat over the medium term, in the low 42s (FY2027-28 to 2030-31: 42.4, 42.6, 42.6, 42.5)."
title: "PBO RP-2627-002-S — PBO calls its own debt-to-GDP track flat in the low-42s"
url: "https://www.pbo-dpb.ca/en/publications/RP-2627-002-S--economic-fiscal-outlook-june-2026--perspectives-economiques-financieres-juin-2026"
