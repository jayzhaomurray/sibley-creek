notes: |
  VINTAGE HARMONIZATION CALL FOR JAY: Four provinces, four budget cadences. The
  most-recent-for-each approach gives:
    - ON: Fall Economic Outlook Nov 2025 (next: Budget 2026 likely March-April)
    - QC: Budget 2025-2026 March 2025 (note: Quebec.ca shows a Budget 2026-2027
      press release; researcher could not confirm release date from primary —
      flag SPECULATIVE on whether QC 2026-2027 numbers are available)
    - AB: Budget 2026 (Feb 26, 2026)
    - BC: Budget 2026 (Feb 17, 2026)
  Spread of release dates spans 11 months; the chart should annotate vintage on
  each province's bar / line. Recommend small "as of" badge per bar.

  NOMENCLATURE WARNING: BC publishes "taxpayer-supported debt-to-GDP," not "net
  debt-to-GDP." These are different denominators (net debt includes financial
  assets netting; taxpayer-supported excludes self-supported Crown corporation
  debt). Cross-province comparison requires either (a) all-net or (b)
  all-taxpayer-supported series — RBC Economics and TD Economics use
  net-debt-to-GDP harmonized across provinces by their fiscal desks, but those
  are competitor citations (banned).
  Researcher recommendation: cite BC's net-debt-to-GDP line separately if BC
  publishes it (Budget 2026 backgrounder PDF — researcher could not confirm
  inside this session via WebFetch); else annotate BC's bar with footnote
  "taxpayer-supported basis" and call out the methodology gap in the blurb.

  Tier B: each province's official URL is the primary, but the canonical
  budget PDFs returned 403 on WebFetch; values reproduced consistently by
  province press releases (Government of Ontario, finances.gouv.qc.ca,
  Open Alberta, BC News) and confirmed by RBC Provincial Outlook coverage.
  Bank coverage cited only to confirm the primary value matches — not as the
  citation itself. Each provincial press release IS a credible secondary
  under the editorial/credible_secondaries.md allowlist (Canadian government
  secondary).
