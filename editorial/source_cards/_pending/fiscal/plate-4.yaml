id: provincial_net_debt_to_gdp_four
title: "Plate-4 Four-province net debt-to-GDP — ON / QC / AB / BC most-recent budgets"
url: "https://budget.ontario.ca/2025/fallstatement/chapter-3.html"
anchor: ""
excerpt: |
  Ontario 2025 Fall Economic Outlook and Fiscal Review (Nov 2025): "The net
  debt-to-GDP ratio is projected to be 37.7 per cent in 2025-26 ... 38.7 per cent
  in 2026-27 and 38.4 per cent in 2027-28. The ratio is forecast to remain below
  the government's target of 40.0 per cent."

  Quebec Budget 2025-2026 (March 25, 2025): "Quebec's net debt ratio is forecast
  to be 38.8% of GDP in FY 2025/26 ... the government aims to reduce net debt
  to GDP to 35.5% by 2032-2033 and to 32.5% by 2037-2038."

  Alberta Budget 2026 (Feb 26, 2026): "Net debt to GDP is expected to turn higher
  to 10.5% in FY 2026-27, and to nudge upward to 13% by FY 2028-29. Outside of
  the pandemic, these levels would mark their highest in 30 years."

  British Columbia Budget 2026 (Feb 17, 2026): "The taxpayer-supported
  debt-to-GDP ratio is forecast at 30.6% in 2026-27, 34.4% in 2027-28 and 37.4%
  in 2028-29."
