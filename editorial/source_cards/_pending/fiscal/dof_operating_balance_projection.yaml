notes: |
  PRIMARY SOURCE, PRIMARY FETCH. The SEU 2026 Annex 1 HTML returned 200 OK
  on direct WebFetch and contained the full year-by-year operating balance
  decomposition in Table A1.5. The chart (Chart 2 of the Overview page)
  reproduces the same series rounded to the nearest billion.

  Note: SEU 2026 (April 2026) is the freshest vintage of the DoF operating
  balance track. It REVISES the Budget 2025 (November 2025) baseline. Per
  user canon "always use the freshest vintage," plate-4 should use SEU 2026
  numbers, not Budget 2025.

  Compared to the PBO reclassification (RP-2526-017-S, Nov 14 2025), the
  SEU 2026 DoF operating balance is materially smaller in every year. PBO
  found $18.1bn operating deficit in 2028-29 using a narrower capital
  definition (IMF GFS 2014); DoF's own April 2026 projection has the
  operating balance at +$0.9bn (small surplus) in the same year. The gap
  reflects (a) PBO's stricter capital definition and (b) better-than-Budget
  2025 economic news between Nov 2025 and April 2026.

  Tier A — primary HTML directly fetched and parsed. Triangulation block
  carries the budget.canada.ca Overview page (Chart 2 of the same
  publication, which restates the same series rounded) as a second
  primary-pub cross-reference within the same document.
