excerpt: |
  Department of Finance Canada, Spring Economic Update 2026, Annex 1 (Details
  of economic and fiscal projections), Table A1.5 (Day-to-Day Operating
  Balance, in billions of dollars):

  Total expenses: FY2025-26 578.3; FY2026-27 595.0; FY2027-28 609.9;
  FY2028-29 623.7; FY2029-30 645.9; FY2030-31 666.9.
  Capital investments (expenses): 34.0; 47.4; 51.2; 51.6; 53.8; 54.2.
  Day-to-day operating expenses: 544.3; 547.6; 558.7; 572.0; 592.2; 612.7.
  Budgetary revenues: 511.5; 529.6; 546.8; 565.9; 589.8; 613.7.
  Capital investments (revenues): 6.5; 7.5; 6.7; 7.0; 6.8; 5.2.
  Day-to-day operating balance: FY2025-26 -26.4; FY2026-27 -10.5;
  FY2027-28 -5.2; FY2028-29 +0.9; FY2029-30 +4.5; FY2030-31 +6.1.

  Accompanying text (verbatim): "from 2028-29 through to 2030-31, projected
  revenues are expected to more than offset day-to-day operating spending,
  meeting the government's fiscal anchor of balancing day-to-day operating
  spending with revenues."
