excerpt: |
  The government posted a budgetary deficit of $19.3 billion for the April to
  February period of the 2024-25 fiscal year, compared to a deficit of $17.3
  billion reported for the same period of 2023-24. The accumulated deficit
  increased by $13.2 billion over the April 2024 to February 2025 period,
  reflecting the $19.3-billion budgetary deficit and $6.1 billion in net
  remeasurement gains.
