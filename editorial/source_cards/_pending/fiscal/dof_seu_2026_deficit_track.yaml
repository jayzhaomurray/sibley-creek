notes: |
  Annex 1 of the Spring Economic Update 2026 contains the canonical 5-year fiscal
  track in Table A1.7. The HTML version on budget.canada.ca returns clean fetch
  with the full table extracted. Plate-3 of /fiscal/ shows this 5-year track
  against the PBO EFO September 2025 track (the parallel researcher's
  pbo_efo_sept_2025_deficit_track.yaml card holds that side).

  The deficit declines from $66.9bn (2.1% of GDP) in FY2025-26 to $53.2bn (1.4%
  of GDP) by FY2030-31 — consistent with the government's stated fiscal anchor
  of a declining deficit-to-GDP ratio and capital investment accounting for
  100% of the deficit by FY2028-29.

  Tier A: primary HTML directly fetched, verbatim table extracted, full
  numerical track captured. Triangulation block carries the budget.canada.ca
  Overview page (which restates the FY2025-26 and FY2030-31 anchor values) and
  The Globe and Mail coverage of the April 28 release.
