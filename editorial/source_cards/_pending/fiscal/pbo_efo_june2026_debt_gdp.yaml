id: pbo_efo_june2026_debt_gdp
title: "Parliamentary Budget Officer — Economic and Fiscal Outlook – June 2026 (RP-2627-002-S)"
url: "https://www.pbo-dpb.ca/en/publications/RP-2627-002-S--economic-fiscal-outlook-june-2026--perspectives-economiques-financieres-juin-2026"
anchor: ""
excerpt: |
  PBO projects the federal debt-to-GDP ratio at 41.3 per cent in 2025-26,
  rising to 42.5 per cent by 2030-31. Budgetary deficits average $4.6 billion
  per year above the government's Spring Economic Update 2026 track, driven by
  lower personal income tax revenues and higher program expenses, partially
  offset by lower public debt charges. 2025-26 budgetary deficit projected at
  $72.0 billion (2.2 per cent of GDP) vs $66.9 billion in the SEU.
