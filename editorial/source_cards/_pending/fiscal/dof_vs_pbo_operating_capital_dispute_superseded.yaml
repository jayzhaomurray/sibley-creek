notes: |
  COMPOSITE INSIGHT for the new DoF-vs-PBO operating/capital plate. This card
  assembles the same-vintage Budget 2025 pair into the single editorial unit the
  plate needs: Budget 2025 AS PRESENTED operating balance vs the PBO-definition
  operating track, on the one vintage (RP-2526-017-S Table 4). The $94bn cumulative
  gap on this pair IS the sum of the visible bar gaps -- vintage-clean by construction.

  Re-fetch status: PRIMARY RE-CONFIRMED 2026-06-05 (pre-ship check). RP-2526-017-S
  fetched live; publication date Nov 14, 2025, unrevised. Verbatim confirmed on the
  live page: "PBO maintains its view that the Government's definition of capital
  investments is overly expansive." and "Based on PBO's definition, capital
  investments would total $217.3 billion over 2024-25 to 2029-30--approximately
  30 per cent ($94 billion) lower compared to Budget 2025." and "based on our
  definition, the operating balance in Budget 2025 would remain in a deficit
  position over 2024-25 to 2029-30 (Table 4)". Tier A chain closed mechanically;
  the earlier inherited-tier caveat is resolved. (Table 4 year-by-year values are
  in the report PDF, extracted 2026-06-04; the live HTML confirms the table's
  existence, direction, and the $94bn total.)

  EDITORIAL FRAMING (Mode 3 on the PBO side -- "PBO argues," not "is true"):
  The Budget 2025 as-presented operating-balance line is the government's own stated
  track (cite as fact). The PBO recast is a CONTESTED-DEFINITION view -- attribute by
  name ("the PBO reads the split more narrowly," "on the PBO's definition the
  operating books never reach balance"). The $94bn wedge is PBO's claim about DoF's
  classification, not an agreed fact. The frame test (writing-style §8c): "the PBO
  recasts $94bn of capital as operating" works honestly; "DoF misclassified $94bn"
  does NOT -- that asserts the PBO's contested view as truth and must not ship.

  Jay's editorial angle is supported: the split into two budget-balance types is a
  government framing choice, and whether spending is genuinely capital vs operating
  is exactly what PBO contests. The honest version is "the anchor is met only under
  the government's own capital definition" -- verified and defensible -- NOT "the
  government is misclassifying" stated as fact. PBO's characterization of that
  definition is verbatim "overly expansive" (Highlights, p.1).

  CHART-BUILD CAVEAT:
  - Carry the dispute on the same-vintage Budget 2025 pair: the as-presented
    operating balance (2028-29 first zero-crossing) against the PBO-definition track
    (never reaches balance). The $94bn cumulative gap is the sum of the bar gaps.
  - The reclassification rests on corporate income-tax expenditures, investment tax
    credits, and operating subsidies. Do NOT assert "defence and housing
    reclassified" -- those are not the line items behind the $94bn.

  SYNTHESIS MOVED OUT OF EXCERPT (2026-06-05; excerpt now holds verbatim Table 4
  rows + verbatim quotes only):
  - Budget 2025 as-presented operating balance first zero-crossing is FY2028-29
    (the -4.1 / -33.0 / -8.7 / -5.5 / +1.7 / +3.0 row turns positive in 2028-29).
  - Per-year gap between the two Table 4 rows: 6.4, 12.8, 16.6, 17.8, 19.8, 20.6;
    cumulating to ~$94bn over the plan's six years. This is DERIVED from the
    visible row-pair differences, not a printed Table 4 row; it matches the ~$94bn
    capital-classification wedge (Table 3: 311.6 vs 217.4 within rounding of the
    311.5/217.3 values in verified_value). On the same-vintage pair the wedge IS
    the sum of the visible bar gaps.
  - PBO reclassifies corporate income-tax expenditures, investment tax credits, and
    operating subsidies out of capital and back into operating (verified categories
    per RP-2526-017-S; see pbo_reclassified_categories).
  - "Too loose" is the ratified plain-English render of "overly expansive" for
    reader copy, attributed ("the watchdog thinks" / "the PBO reads the split more
    narrowly").

