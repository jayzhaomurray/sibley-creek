excerpt: |
  [PBO RP-2526-017-S, Table 4 — Day-to-day operating balance, $B, FY2024-25 to
  2029-30]:
  Budget 2025 as presented: -4.1, -33.0, -8.7, -5.5, +1.7, +3.0.
  Same budget, PBO definition: -10.5, -45.8, -25.3, -23.3, -18.1, -17.6.

  [PBO RP-2526-017-S, Highlights, p.1]: "PBO maintains its view that the
  Government's definition of capital investments is overly expansive."

  [PBO RP-2526-017-S]: "Using the PBO's narrower capital definition, day-to-day
  operating deficits are $10.5 billion in 2024-25, $45.8 billion in 2025-26,
  $25.3 billion in 2026-27, $23.3 billion in 2027-28, $18.1 billion in 2028-29,
  and $17.6 billion in 2029-30. PBO projects Ottawa's actual investment spending
  will be $217.3 billion from 2024-25 to 2029-30, rather than $311.5 billion --
  approximately $94 billion (roughly 30 per cent) lower."
