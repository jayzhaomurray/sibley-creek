  # Section 232 stack — Commerce Department / Federal Register proclamations
  # -----------------------------------------------------------------------
  - phrase: "Steel: raised from 25% to 50% on 2025-06-04"
    source: "other:Presidential Proclamation 10947 (Adjusting Imports of Steel into the United States), raising Section 232 steel duty to 50% effective 2025-06-04; Federal Register."
  - phrase: "Aluminum: raised from 25% to 50% on 2025-06-04"
    source: "other:Presidential Proclamation (Adjusting Imports of Aluminum into the United States), raising Section 232 aluminum duty to 50% effective 2025-06-04; Federal Register."
  - phrase: "Copper: 50% on core articles and 25% on derivatives, added\n  2026-04-06 under a 2026-04-02 proclamation"
    source: "other:Presidential Proclamation on Section 232 copper duties dated 2026-04-02, effective 2026-04-06; 50% on core copper articles, 25% on derivatives; Federal Register."
  - phrase: "Autos and auto parts: 25%"
    source: "other:Presidential Proclamation 10908 (Adjusting Imports of Automobiles and Automobile Parts into the United States), Section 232 25% duty on autos and parts; Federal Register."
  - phrase: "Softwood lumber: 10% Section 232 stacked on top of the existing\n  countervailing and anti-dumping duties, effective October 2025"
    source: "other:Presidential Proclamation imposing Section 232 10% duty on softwood lumber and timber products, effective October 2025; Federal Register notice."
  - phrase: "A de minimis carve-out arrived in April 2026: goods containing\n15% or less subject metal content are exempt"
    source: "other:Section 232 de minimis exemption for derivatives containing 15% or less subject-metal content, US Commerce Department implementation notice April 2026."

