  - phrase: "66.1% of Canada's merchandise exports went to the\n  United States"
    source: "pipeline:statcan:12-10-0121-01"
    note: "US share of total Canadian merchandise exports, March 2026. Derived: exports to US / total exports."
  - phrase: "In calendar 2024, the figure averaged 76.3%"
    source: "pipeline:statcan:12-10-0121-01"
    note: "Calendar-2024 average US share of total Canadian merchandise exports. Derived: sum of 12-month US exports / sum of 12-month total exports."
  - phrase: "share has fallen roughly ten percentage points in fourteen months"
    source: "derived"
    note: "76.3% (2024 avg) minus 66.1% (March 2026) = 10.2 pp over 14 months from end-Jan 2025 to end-Mar 2026."

