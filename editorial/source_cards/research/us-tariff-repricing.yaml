  # -----------------------------------------------------------------------
  # Section 232 stack rationale — restated rates
  # -----------------------------------------------------------------------
  - phrase: "rates already at 50% on the metals lines\nand a stacked 45% effective burden on softwood lumber"
    source: "derived"
    note: "50% metals = Section 232 steel/aluminum rate (see Proclamation 10947). 45% lumber = 35.16% AD/CVD + 10% Section 232 (see softwood paragraph)."

  # -----------------------------------------------------------------------
  # Softwood arithmetic — Commerce AD/CVD determinations
  # -----------------------------------------------------------------------
  - phrase: "anti-dumping and countervailing duty rate on\nCanadian softwood sat at a combined 35.16% before April 2026"
    source: "other:US Department of Commerce final AD and CVD rates on softwood lumber from Canada in effect prior to April 2026 preliminary review (combined 35.16%); Federal Register AD/CVD orders."
  - phrase: "Section 232 rate on lumber adds another 10%"
    source: "other:Presidential Proclamation imposing Section 232 10% duty on softwood lumber, effective October 2025."
  - phrase: "The effective burden\ntoday is approximately 45%"
    source: "derived"
    note: "35.16% AD/CVD + 10% Section 232 = 45.16%, rounded to ~45%."
  - phrase: "A preliminary Commerce Department review published on 2026-04-14\nproposes cutting the AD/CVD components to 24.83% (anti-dumping\n10.66% plus countervailing 14.17%)"
    source: "other:US Federal Register notice 2026-07154 (2026-04-14), Commerce Department preliminary AD and CVD review on softwood lumber from Canada; preliminary rates AD 10.66% + CVD 14.17% = 24.83%."
  - phrase: "pending final determinations\nin August and October 2026"
    source: "other:US Commerce Department softwood lumber AD/CVD review schedule: final AD determination expected August 2026, final CVD determination expected October 2026 (per Federal Register notice 2026-07154 and Congressional Research Service R48781)."
  - phrase: "the\neffective burden falls to about 34.83%"
    source: "derived"
    note: "24.83% post-cut AD/CVD + 10% Section 232 = 34.83%."

