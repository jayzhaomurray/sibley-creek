  # -----------------------------------------------------------------------
  - phrase: "On 2025-02-01, the United States invoked the International\nEmergency Economic Powers Act to impose 25% tariffs on non-CUSMA-\ncompliant Canadian goods and 10% on energy and potash, effective\n2025-02-04"
    source: "other:White House Executive Order 14193 (Imposing Duties to Address the Flow of Illicit Drugs Across Our Northern Border), 2025-02-01; Federal Register publication; CBP implementation guidance for 2025-02-04 effective date."
  - phrase: "On 2025-08-01, the non-compliant rate rose to 35%"
