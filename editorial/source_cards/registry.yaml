# Source-card registry — every PDF/HTML publication cited as a fact in
# reader-facing prose or as a chart-component constant is listed here with
# its current verified vintage, its probe URL (the listing or index page
# where a newer vintage would appear), and its re-verify cadence.
#
# API-backed series (BoC Valet, StatCan tables, FRED) are NOT listed here.
# The Python pipeline auto-refreshes those daily, and a stale series surfaces
# as a pipeline error or a visible "not wired" state on the site.
#
# Schema per entry:
#   id:                stable slug.
#   title:             human-readable publication name.
#   url:               the actual URL of the cited vintage.
#   anchor:            optional anchor to deep-link into the source (PDF page or HTML id).
#                      Appended to url when constructing audit links (e.g., "#page=24").
#   excerpt:           verbatim quote from the source supporting the cited value(s).
#                      Rendered inline under each tagged claim in the audit view.
#   currency_probe_url: the URL the cron probes for newer vintages.
#   verified_value:    the value(s) we currently cite from this source.
#   verified_at:       date we last verified the value against the URL.
#   vintage_label:     human label of the source's vintage (e.g., "April 2026").
#   next_expected:     when the next vintage is expected (rough date / window).
#   cadence:           how often the publication releases (quarterly / 8x_year / monthly / annual / 5_year).
#   cited_in:          list of files where the value is referenced.
#   notes:             any caveats.
#
# Tiered verification fields (REQUIRED):
#   verification_tier: "A" | "B" | "C"
#                      A = Primary verified (researcher fetched primary, verbatim excerpt captured).
#                      B = Triangulated secondary (2+ independent credible secondaries reproduce the claim).
#                      C = Single credible secondary (used sparingly; requires explicit justification).
#                      See editorial/credible_secondaries.md for the allowlist.
#                      Tier D claims (below the bar) do not appear in this registry;
#                      they are cut from prose at production time.
#   user_confirmed_at: ISO date (YYYY-MM-DD) — date the user (jzm) walked the verification chain
#                      and approved the card. REQUIRED for tier B and C; null/absent fails the gate.
#   user_confirmed_by: short user handle (e.g., "jzm"). REQUIRED alongside user_confirmed_at.
#   triangulation:     list of credible secondaries used to verify a Tier B or C claim.
#                      Each entry: { source, url, excerpt, credibility }.
#                      Only required when verification_tier is "B" or "C".
#   grandfathered:     true if backfilled during the 2026-05-13 tier-system migration.
#                      Triangulation block to be filled in when walked in the verification queue.
#
# Mode 3 fields (analysis citation; see writing-style.md §8c):
#   mode:              integer; 3 for analysis citations of a named third-party.
#                      Default omitted = fact citation (Modes 1/2 implicit).
#   user_approved_at:  ISO date — date the user approved the Mode 3 citation.
#                      REQUIRED for Mode 3 cards; absent fails the gate.
#   user_approved_by:  user handle.
#   frame_test_check:  short note confirming the frame test was applied
#                      ("'X argues Y' framing preserved in prose at <location>").
#
# Enumeration cards (for countable claims — "Nth consecutive", "first since"):
#   enumeration:       list of dates OR list of {date, label} objects defining
#                      the authoritative set. Citations with `expected_count:`
#                      validate against this length; citations with
#                      `compute: count_enumeration(<this_card>)` derive the
#                      count automatically. Author updates the enumeration on
#                      each refresh; build fails if expected_count drifts.

