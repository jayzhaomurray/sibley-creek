    anchor: "#potential-output"
    excerpt: "Growth in potential output is expected to average 1.2% in 2026 before picking up modestly to 1.3% in 2027 and 1.5% in 2028."
    currency_probe_url: "https://www.bankofcanada.ca/publications/mpr/"
    verified_value:
      potential_growth_2026: 1.2
      potential_growth_2027: 1.3
      potential_growth_2028: 1.5
    verified_at: 2026-05-13
    vintage_label: "April 2026"
    next_expected: 2026-07-23
    cadence: "quarterly"
    cited_in:
