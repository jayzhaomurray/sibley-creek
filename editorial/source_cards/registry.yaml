# Source-card registry — every PDF/HTML publication cited as a fact in
# reader-facing prose or as a chart-component constant is listed here with
# its current verified vintage, its probe URL (the listing or index page
# where a newer vintage would appear), and its re-verify cadence.
#
# API-backed series (BoC Valet, StatCan tables, FRED) are NOT listed here.
# The Python pipeline auto-refreshes those daily, and a stale series surfaces
# as a pipeline error or a visible "not wired" state on the site.
#
# Schema per entry:
#   id:                stable slug.
#   title:             human-readable publication name.
#   url:               the actual URL of the cited vintage.
#   anchor:            optional anchor to deep-link into the source (PDF page or HTML id).
#                      Appended to url when constructing audit links (e.g., "#page=24").
#   excerpt:           verbatim quote from the source supporting the cited value(s).
#                      Rendered inline under each tagged claim in the audit view.
#   currency_probe_url: the URL the cron probes for newer vintages.
#   verified_value:    the value(s) we currently cite from this source.
#   verified_at:       date we last verified the value against the URL.
#   vintage_label:     human label of the source's vintage (e.g., "April 2026").
#   next_expected:     when the next vintage is expected (rough date / window).
#   cadence:           how often the publication releases (quarterly / 8x_year / monthly / annual / 5_year).
#   cited_in:          list of files where the value is referenced.
#   notes:             any caveats.

sources:

  - id: boc_mpr_potential_growth
    title: "BoC Monetary Policy Report — Appendix: Potential output and the nominal neutral rate of interest"
    url: "https://www.bankofcanada.ca/publications/mpr/mpr-2026-04-29/appendix/"
    anchor: "#potential-output"
    excerpt: "Growth in potential output is expected to average 1.2% in 2026 before picking up modestly to 1.3% in 2027 and 1.5% in 2028."
    currency_probe_url: "https://www.bankofcanada.ca/publications/mpr/"
    verified_value:
      potential_growth_2026: 1.2
      potential_growth_2027: 1.3
      potential_growth_2028: 1.5
    verified_at: 2026-05-13
    vintage_label: "April 2026"
    next_expected: 2026-07-23
    cadence: "quarterly"
    cited_in:
      - "src/components/charts/gdp/Panel1HeadlineGDPV3.astro (POTENTIAL_GROWTH_PCT)"
      - "src/data/sections.ts (gdp.blurb.body)"
      - "src/pages/gdp.astro (plate-1)"
    notes: "Cited value is the 2026 near-term estimate (1.2%). Multi-year path 2026/27/28 = 1.2/1.3/1.5. The same Appendix reaffirms the 2.25-3.25% nominal neutral range — see boc_mpr_neutral_range entry."

  - id: boc_mpr_neutral_range
    title: "BoC nominal neutral range (BoC MPR Appendix annual review)"
    url: "https://www.bankofcanada.ca/publications/mpr/mpr-2026-04-29/appendix/"
    anchor: "#neutral-rate"
    excerpt: "The Canadian nominal neutral rate is estimated to be within the range of 2.25% to 3.25%, unchanged from that in the April 2025 Report."
    currency_probe_url: "https://www.bankofcanada.ca/publications/mpr/"
    verified_value:
      neutral_range_low: 2.25
      neutral_range_high: 3.25
    verified_at: 2026-05-13
    vintage_label: "April 2026 (unchanged from April 2025)"
    next_expected: 2027-04-22
    cadence: "annual"
    cited_in:
      - "src/pages/policy.astro (plate-1)"
    notes: "BoC reviews the neutral range annually in the April MPR. April 2026 review left it unchanged at 2.25-3.25%."

  - id: fomc_target_rate
    title: "Federal Reserve FOMC target range for the federal funds rate"
    url: "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260429a.htm"
    excerpt: "the Committee decided to maintain the target range for the federal funds rate at 3-1/2 to 3-3/4 percent"
    currency_probe_url: "https://www.federalreserve.gov/monetarypolicy/openmarket.htm"
    verified_value:
      target_range_low: 3.50
      target_range_high: 3.75
    verified_at: 2026-05-13
    vintage_label: "April 29, 2026 FOMC statement"
    next_expected: 2026-06-17
    cadence: "8x_year"
    cited_in:
      - "src/pages/policy.astro (plate-7)"
    notes: "Third consecutive hold at the April 2026 meeting. Next FOMC June 16-17, 2026."

  - id: boc_inflation_mandate
    title: "BoC inflation-control mandate"
    url: "https://www.bankofcanada.ca/core-functions/monetary-policy/inflation/"
    excerpt: "2 per cent midpoint of an inflation-control target range of 1 to 3 per cent."
    currency_probe_url: "https://www.bankofcanada.ca/core-functions/monetary-policy/inflation/"
    verified_value:
      target_midpoint: 2.0
      control_band_low: 1.0
      control_band_high: 3.0
    verified_at: 2026-05-13
    vintage_label: "December 2021 renewal (5-year term)"
    next_expected: 2026-12-01
    cadence: "5_year"
    cited_in:
      - "src/pages/inflation.astro (plates 1, 2, 4)"
      - "src/data/sections.ts (inflation.blurb.body)"
    notes: "Joint BoC/Government of Canada mandate renewal typically lands in November or December of the renewal year. Current mandate operative through end-2026; a new mandate could in principle adjust the midpoint or band (the 2021 renewal kept both unchanged)."

  - id: boc_5y_mortgage_rate
    title: "BoC 5-year conventional mortgage rate (Valet series V80691335)"
    url: "https://www.bankofcanada.ca/valet/observations/V80691335/json?recent=15"
    excerpt: "Latest 15 weekly observations from 2026-01-28 through 2026-05-06 all print 6.09%."
    currency_probe_url: "https://www.bankofcanada.ca/valet/observations/V80691335/json?recent=4"
    verified_value:
      rate_latest: 6.09
      stable_since: 2026-01-28
    verified_at: 2026-05-13
    vintage_label: "Weekly print 2026-05-06"
    next_expected: 2026-05-13
    cadence: "weekly"
    cited_in:
      - "src/pages/housing.astro (plate-5)"
    notes: "API-backed via BoC Valet but cited as a literal in prose, so listed here for currency-tracking. Pipeline does NOT yet pull this series into panel_data; prose is hand-typed."
